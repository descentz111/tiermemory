<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Toni und Max">
<title>Toni und Max</title>
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  :root{--bg:#FFF6E5;--ink:#3B2F2A;--accent:#FF8A3D;--green:#5BB87A;--blue:#4F8EDC;--red:#E5534B;--t:56px}
  @font-face{font-family:Schul;src:url(schulschrift.woff2) format('woff2');font-weight:700;font-display:swap}
  .slot,.tile{font-family:Schul,-apple-system,system-ui,sans-serif!important;font-weight:700}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;touch-action:manipulation;
    font-family:-apple-system,"SF Pro Rounded","Arial Rounded MT Bold",system-ui,sans-serif}
  .screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;
    padding:calc(env(safe-area-inset-top) + 10px) 14px calc(env(safe-area-inset-bottom) + 16px)}
  .screen.on{display:flex}
  .btn{border:0;border-radius:22px;padding:18px 30px;font:inherit;font-size:24px;font-weight:800;color:#fff;background:var(--green);box-shadow:0 5px 0 #3F9560}
  .btn:active{transform:translateY(4px);box-shadow:0 1px 0 #3F9560}
  .home{align-self:flex-start;border:0;background:#fff;border-radius:16px;width:46px;height:42px;font-size:22px;box-shadow:0 2px 0 #EBDCC2}

  #scene{width:100%;max-width:520px;border-radius:24px;overflow:hidden;box-shadow:0 4px 0 #E3D3B8;margin-top:8px;background:#BFE3FF}
  #scene svg{display:block;width:100%;height:auto}
  #text{font-size:24px;font-weight:700;line-height:1.35;text-align:center;margin:18px 4px;max-width:520px;flex:1;display:flex;align-items:center}
  .next{border:0;width:84px;height:84px;border-radius:50%;background:var(--accent);color:#fff;font-size:44px;font-weight:900;box-shadow:0 5px 0 #D96A22}
  .next:active{transform:translateY(4px);box-shadow:0 1px 0 #D96A22}
  .next.hide{visibility:hidden}

  #wordScreen #hint{width:min(44vw,190px);height:min(44vw,190px);background:#fff;border-radius:28px;box-shadow:0 4px 0 #E3D3B8;margin-top:10px}
  #wordScreen #hint svg{width:100%;height:100%}
  #wq{font-size:22px;font-weight:700;text-align:center;margin:12px 0 0}
  .row{display:flex;gap:6px;justify-content:center;margin:14px 0}
  .slot,.tile{width:var(--t);height:calc(var(--t)*1.15);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:calc(var(--t)*.62);font-weight:900}
  .slot{background:#fff;border:3px dashed #D9C6A6}
  .slot.full{border-style:solid;border-color:var(--blue)}
  .slot.ok{border-color:var(--green);background:#E9F7EE;color:#2E7D4F}
  .slot.bad{border-color:var(--red);background:#FDECEA;animation:shake .4s}
  .slot.lit{transform:scale(1.15);background:#FFF1C2;border-color:#F4B400;transition:transform .15s}
  .tile.glow{box-shadow:0 0 0 5px #FFD23F,0 5px 0 #2C5E9E}
  .slot.show{border:3px solid var(--accent);color:var(--accent)}
  .tile{background:var(--blue);color:#fff;box-shadow:0 5px 0 #2C5E9E;transition:transform .5s cubic-bezier(.3,1.4,.5,1),opacity .2s}
  .tile.gone{opacity:0;pointer-events:none}
  #tray{min-height:calc(var(--t)*1.3);flex-wrap:wrap}
  #wmsg{font-size:22px;font-weight:800;min-height:30px;color:var(--accent)}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(6px)}75%{transform:translateX(-6px)}}
  .flyout{animation:fly .7s ease-in-out}
  @keyframes fly{30%{transform:translateY(-14px) rotate(-12deg)}60%{transform:translateY(8px) rotate(14deg)}}

  #rain{padding:0;background:#BFE3FF}
  #rain canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}

  #start{justify-content:center;gap:18px;text-align:center}
  #start h1{font-size:38px;margin:0}
  .chs{display:flex;gap:10px}
  .ch{border:0;border-radius:20px;width:100px;padding:12px 0 14px;background:#fff;box-shadow:0 5px 0 #E3D3B8;font:inherit;font-size:18px;font-weight:800;color:var(--ink)}
  .ch span{display:block;font-size:40px;margin-bottom:4px}
  .ch:active{transform:translateY(4px);box-shadow:0 1px 0 #E3D3B8}
</style>
</head>
<body>

<section id="start" class="screen on">
  <div id="startPic" style="width:100%;max-width:460px;border-radius:24px;overflow:hidden"></div>
  <h1>Toni und Max</h1>
  <div id="items" style="font-size:16px;font-weight:700;opacity:.7"></div>
  <button class="btn" id="go">Los geht's!</button>
</section>

<section id="story" class="screen">
  <button class="home" data-home>🏠</button>
  <div id="scene"></div>
  <div id="text"></div>
  <button class="next" id="nextBtn">➜</button>
</section>

<section id="wordScreen" class="screen">
  <button class="home" data-home>🏠</button>
  <div id="hint"></div>
  <div id="wq"></div>
  <div class="row" id="slots"></div>
  <div id="wmsg"></div>
  <div class="row" id="tray"></div>
</section>

<section id="rain" class="screen"><canvas id="c"></canvas></section>

<script>
const $=id=>document.getElementById(id);
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id))}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

// ================= Sprache & Töne =================
let voice=null;
function pickVoice(){const v=speechSynthesis.getVoices().filter(x=>x.lang&&x.lang.toLowerCase().startsWith('de'));
  voice=v.find(x=>/Anna|Helena|Petra|Marlene/i.test(x.name))||v[0]||null}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
let sayT=null;
function say(t,delay=0,onend){if(!('speechSynthesis' in window)){onend&&onend();return}speechSynthesis.cancel();clearTimeout(sayT);
  const u=new SpeechSynthesisUtterance(t);u.lang='de-DE';if(voice)u.voice=voice;u.rate=.85;u.pitch=1.1;if(onend)u.onend=onend;window._u=u;
  sayT=setTimeout(()=>speechSynthesis.speak(u),delay)}
let ac=null;
function audio(){if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(ac&&ac.state==='suspended')ac.resume()}
function tone(f1,f2,dur,type='sine',vol=.35,delay=0){if(!ac)return;const t=ac.currentTime+delay,o=ac.createOscillator(),g=ac.createGain();
  o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+dur)}
const plop=()=>tone(500+Math.random()*200,1300,.12);
const bonk=()=>tone(180,70,.25,'triangle',.5);
const jubel=()=>[523,659,784,1047].forEach((f,i)=>tone(f,f,.25,'sine',.3,i*.12));
function noise(dur,freq,vol=.4,delay=0){if(!ac)return;const t=ac.currentTime+delay,b=ac.createBuffer(1,ac.sampleRate*dur,ac.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);const src=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();
  src.buffer=b;f.type='bandpass';f.frequency.value=freq;g.gain.value=vol;src.connect(f).connect(g).connect(ac.destination);src.start(t)}
const plumps=()=>{tone(170,70,.18,'triangle',.6);noise(.06,2500,.35,.02)};   // Karotte landet im Korb
const raschel=()=>noise(.25,3500,.5);                                      // Stroh in die Schubkarre
const catchSound=()=>CH==='hunger'?plumps():CH==='muede'?raschel():plop();
const slurp=()=>tone(300,150,.18,'sine',.25);
function neigh(){if(!ac)return;const t=ac.currentTime,o=ac.createOscillator(),l=ac.createOscillator(),lg=ac.createGain(),g=ac.createGain();
  o.type='sawtooth';o.frequency.setValueAtTime(700,t);o.frequency.linearRampToValueAtTime(950,t+.25);o.frequency.linearRampToValueAtTime(500,t+1);
  l.frequency.value=14;lg.gain.value=60;l.connect(lg).connect(o.frequency);
  g.gain.setValueAtTime(.001,t);g.gain.linearRampToValueAtTime(.18,t+.05);g.gain.linearRampToValueAtTime(.001,t+1);
  o.connect(g).connect(ac.destination);o.start(t);l.start(t);o.stop(t+1);l.stop(t+1)}

// ================= Zeichnungen =================
function horse(o={}){ // o.thirsty, o.happy, o.sleep, o.items (Anzahl Belohnungen); Kopf-Gruppe id=hhead (dreht um 55,-10)
  const n=o.items||0;
  return `<g id="horse">
  <path d="M-66 -12 Q-95 10 -88 55" stroke="#5A3418" stroke-width="12" fill="none" stroke-linecap="round"/>
  <rect x="-55" y="15" width="13" height="62" rx="5" fill="#8B5A2B"/><rect x="-36" y="15" width="13" height="62" rx="5" fill="#A0693A"/>
  <rect x="32" y="15" width="13" height="62" rx="5" fill="#8B5A2B"/><rect x="50" y="15" width="13" height="62" rx="5" fill="#A0693A"/>
  <rect x="-56" y="70" width="15" height="9" rx="3" fill="#3B2412"/><rect x="-37" y="70" width="15" height="9" rx="3" fill="#3B2412"/>
  <rect x="31" y="70" width="15" height="9" rx="3" fill="#3B2412"/><rect x="49" y="70" width="15" height="9" rx="3" fill="#3B2412"/>
  <ellipse cx="0" cy="0" rx="72" ry="36" fill="#A0693A"/>
  ${n>=3?`<rect x="-32" y="-36" width="54" height="36" rx="8" fill="#4F8EDC"/><rect x="-32" y="-6" width="54" height="5" fill="#FFD23F"/>`:''}
  ${n>=4?`<ellipse cx="-5" cy="-36" rx="28" ry="9" fill="#6B3E1E"/><path d="M-5 -30 L-5 10" stroke="#3B2412" stroke-width="2.5"/><rect x="-11" y="8" width="12" height="6" rx="2" fill="#888"/>`:''}
  <g id="hhead">
    <polygon points="40,-20 72,-82 98,-70 72,12" fill="#A0693A"/>
    <path d="M70 -84 Q52 -50 40 -18" stroke="#5A3418" stroke-width="12" fill="none" stroke-linecap="round"/>
    <polygon points="74,-86 80,-108 88,-84" fill="#8B5A2B"/>
    <ellipse cx="102" cy="-66" rx="32" ry="17" fill="#A0693A" transform="rotate(28 102 -66)"/>
    <ellipse cx="120" cy="-55" rx="12" ry="10" fill="#C48A55" transform="rotate(28 120 -55)"/>
    <circle cx="123" cy="-55" r="2.5" fill="#3B2412"/>
    ${o.sleep?`<path d="M87 -74 Q92 -70 97 -74" stroke="#222" stroke-width="2.5" fill="none" stroke-linecap="round"/>`:`<circle cx="92" cy="-74" r="4.5" fill="#222"/><circle cx="93.5" cy="-75.5" r="1.5" fill="#fff"/>`}
    ${n>=2?`<ellipse cx="110" cy="-60" rx="20" ry="13" fill="none" stroke="#E5534B" stroke-width="3.5" transform="rotate(28 110 -60)"/><path d="M88 -66 L82 -80" stroke="#E5534B" stroke-width="3.5"/>`:''}
    ${n>=1?`<g transform="translate(70 -76)"><polygon points="0,0 -12,-8 -12,8" fill="#FF6B8B"/><polygon points="0,0 12,-8 12,8" fill="#FF6B8B"/><circle r="4" fill="#E0457B"/></g>`:''}
    ${n>=5?`<path d="M52 -30 Q66 -18 78 -12" stroke="#8B5A2B" stroke-width="3" fill="none"/><circle cx="70" cy="-10" r="7" fill="#F4B400"/><circle cx="70" cy="-5" r="2" fill="#8B5A2B"/>`:''}
    ${n>=6?[[48,-44,'#FF6B8B'],[56,-58,'#FFD23F'],[62,-72,'#9B6BFF'],[44,-30,'#FFD23F']].map(([x,y,c])=>`<circle cx="${x}" cy="${y}" r="5" fill="${c}"/><circle cx="${x}" cy="${y}" r="2" fill="#fff"/>`).join(''):''}
    ${o.thirsty?`<path d="M116 -46 Q118 -34 112 -32 Q108 -36 112 -46 Z" fill="#F27B9A"/>`:''}
    ${o.happy?`<path d="M106 -48 Q114 -42 122 -46" stroke="#3B2412" stroke-width="2.5" fill="none" stroke-linecap="round"/>`:''}
  </g>
  ${o.thirsty?`<path d="M60 -105 Q64 -96 60 -92 Q56 -96 60 -105Z" fill="#7FC0FF"/><path d="M48 -98 Q51 -91 48 -88 Q45 -91 48 -98Z" fill="#7FC0FF"/>`:''}
  </g>`}
function man(){return `<g>
  <rect x="-16" y="-62" width="13" height="62" rx="5" fill="#3E5C99"/><rect x="3" y="-62" width="13" height="62" rx="5" fill="#3E5C99"/>
  <rect x="-18" y="-4" width="17" height="8" rx="3" fill="#4A2E1A"/><rect x="2" y="-4" width="17" height="8" rx="3" fill="#4A2E1A"/>
  <rect x="-22" y="-120" width="44" height="64" rx="14" fill="#E5534B"/>
  <rect x="-34" y="-114" width="12" height="48" rx="6" fill="#E5534B" transform="rotate(10 -28 -114)"/>
  <rect x="22" y="-114" width="12" height="48" rx="6" fill="#E5534B" transform="rotate(-10 28 -114)"/>
  <circle cx="0" cy="-140" r="20" fill="#F6CBA0"/>
  <circle cx="-7" cy="-142" r="2.6" fill="#222"/><circle cx="7" cy="-142" r="2.6" fill="#222"/>
  <path d="M-7 -132 Q0 -126 7 -132" stroke="#222" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <ellipse cx="0" cy="-156" rx="32" ry="6" fill="#8B5A2B"/><rect x="-17" y="-176" width="34" height="20" rx="6" fill="#8B5A2B"/>
  </g>`}
function bucket(fill=0,x=0,y=0,s=1,c=CONT.durst){const h=46,w=50;return `<g transform="translate(${x} ${y}) scale(${s})">
  <path d="M-30 -48 Q0 -82 30 -48" stroke="#777" stroke-width="3" fill="none"/>
  <clipPath id="bc${x|0}"><polygon points="-28,-48 28,-48 22,0 -22,0"/></clipPath>
  <polygon points="-28,-48 28,-48 22,0 -22,0" fill="${c.box}"/>
  <rect id="bw" x="-30" y="${-h*fill}" width="60" height="${h}" fill="${c.fill}" clip-path="url(#bc${x|0})"/>
  <rect x="-30" y="-50" width="60" height="5" rx="2" fill="${c.rim}"/>${c.wheel?`<circle cx="0" cy="6" r="9" fill="#444"/>`:""}
  </g>`}
function cloudG(x,y,s=1,dark=false){const c=dark?'#9AA6B5':'#fff';return `<g transform="translate(${x} ${y}) scale(${s})" fill="${c}">
  <circle cx="0" cy="0" r="22"/><circle cx="22" cy="-12" r="26"/><circle cx="48" cy="0" r="22"/><rect x="0" y="0" width="48" height="20" rx="10"/></g>`}
function sun(x,y){let r='';for(let i=0;i<8;i++){const a=i*Math.PI/4;r+=`<line x1="${x+Math.cos(a)*30}" y1="${y+Math.sin(a)*30}" x2="${x+Math.cos(a)*42}" y2="${y+Math.sin(a)*42}" stroke="#F7B500" stroke-width="5" stroke-linecap="round"/>`}
  return r+`<circle cx="${x}" cy="${y}" r="24" fill="#FFD23F"/>`}
function drops(x,y){let s='';[[0,0],[18,14],[36,2],[10,30],[30,34]].forEach(([dx,dy])=>s+=`<path d="M${x+dx} ${y+dy} q5 9 0 12 q-5 -3 0 -12Z" fill="#3B8EEA"/>`);return s}

const CONT={durst:{box:'#B9C2CC',fill:'#4AA3F0',rim:'#8C96A1'},hunger:{box:'#C68B59',fill:'#FF8A3D',rim:'#8B5A2B'},muede:{box:'#5BB87A',fill:'#E8C14A',rim:'#3F9560',wheel:1}};
function barn(){return `<g><rect x="115" y="120" width="100" height="80" fill="#C0392B"/><polygon points="105,122 165,80 225,122" fill="#8E2A1F"/>
  <rect x="145" y="150" width="40" height="50" fill="#F4F1EA"/><path d="M145 150 L185 200 M185 150 L145 200" stroke="#C0392B" stroke-width="4"/></g>`}
function scene(opt){ // opt: sky, horse, man, bucket, extra
  const sky=opt.sky||'#BFE3FF';
  return `<svg viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="250" fill="${sky}"/>
  ${opt.bg||''}
  ${(opt.barn||(opt.horse&&(opt.horse.items||0)>=7))?barn():''}
  <rect y="200" width="400" height="50" fill="#7CC46A"/>
  ${opt.man?`<g transform="translate(${opt.manX||70} 222) scale(.85)">${man()}</g>`:''}
  ${opt.horse?`<g id="horsePos" transform="translate(${opt.horseX||240} 146) scale(.85)">${horse(opt.horse)}</g>`:''}
  ${opt.bucket!=null?`<g id="bucketG">${bucket(opt.bucket,opt.bucketX||170,224,.9,CONT[opt.cont||'durst'])}</g>`:''}
  ${opt.extra||''}
  </svg>`}

// ================= Geschichte =================
const REWARDS=[['eine Schleife','in die Mähne'],['ein Halfter',''],['eine Satteldecke',''],['einen Sattel',''],['eine Glocke',''],['einen Blumenkranz',''],['einen eigenen Stall','']];
function getItems(){try{return +localStorage.getItem('maxItems')||0}catch(e){return 0}}
function setItems(n){try{localStorage.setItem('maxItems',n)}catch(e){}}
let CH='durst';const ORDER=['durst','hunger','muede'];
function getCh(){try{return ORDER[(+localStorage.getItem('maxCh')||0)%3]}catch(e){return 'durst'}}
function nextCh(){try{localStorage.setItem('maxCh',((+localStorage.getItem('maxCh')||0)+1)%3)}catch(e){}}
const CHAPTERS={
 durst:{intro:['Heute ist es sehr heiß. Max hat großen Durst!'],
   pre:'Danke! Toni holt einen Eimer. Da wird der Himmel grau, und es regnet! Fang die Tropfen mit dem Eimer! Pass auf die Steine auf.',
   finish:'Toni gibt Max den Eimer mit Wasser. Max trinkt und freut sich!',sky:'#A9C4DD',item:'drop',icon:'💧'},
 hunger:{intro:['Max hat großen Hunger! Sein Bauch knurrt.'],
   pre:'Danke! Toni holt einen Korb. Da fallen Karotten vom Wagen! Fang sie mit dem Korb! Pass auf die Steine auf.',
   finish:'Toni gibt Max den Korb mit Karotten. Max frisst und freut sich!',sky:'#BFE3FF',item:'carrot',icon:'🥕'},
 muede:{intro:['Es wird Abend. Max ist ganz müde und möchte schlafen.'],
   pre:'Danke! Toni holt die Schubkarre. Der Wind weht Stroh durch die Luft! Fang es für Max sein Bett! Pass auf die Steine auf.',
   finish:'Toni macht Max ein weiches Bett aus Stroh. Max legt sich hin und schläft ein.',sky:'#3B4A7A',item:'straw',icon:'🌾'}
};
let STEPS=[],NW=5;
function buildSteps(){const c=CHAPTERS[CH],it=getItems();const sc=(o={})=>({man:1,horse:{items:it,...o},sky:c.sky==='#3B4A7A'?'#F6C38A':'#BFE3FF',bg:CH==='durst'?sun(160,45):'',...o.sc});
  const block=(from,len)=>Array.from({length:len},(_,i)=>({t:'word',n:from+i,k:i,of:len}));
  const gift={durst:'sein Wasser',hunger:'seine Karotten',muede:'sein Strohbett'}[CH];
  NW=9;
  STEPS=[
   {t:'story',text:'Das ist Toni. Und das ist sein Pferd Max. '+c.intro[0],sc:sc({thirsty:CH==='durst'?1:0})},
   {t:'story',text:'Toni will Max helfen. Aber zuerst braucht er deine Hilfe bei drei Wörtern!',sc:sc()},
   ...block(0,3),
   {t:'story',text:c.pre,sc:{man:1,horse:{items:it},bucket:0,cont:CH,sky:c.sky,bg:CH==='durst'?cloudG(60,45,1,true)+cloudG(220,40,1.2,true)+drops(80,80)+drops(250,85):(CH==='muede'?'<circle cx="340" cy="45" r="20" fill="#FFF3B0"/>':'')}},
   {t:'rain'},
   {t:'story',text:`Super gefangen! Jetzt noch drei Wörter, dann bekommt Max ${gift}.`,sc:{man:1,horse:{items:it},bucket:1,bucketX:170,cont:CH,sky:'#BFE3FF'}},
   ...block(3,3),
   {t:'drink',text:c.finish},
   {t:'story',text:'Max freut sich! Noch drei Wörter, dann bekommt Max ein Geschenk.',sc:sc({happy:1})},
   ...block(6,3),
   {t:'reward'},
   {t:'end',text:'Danke, dass du Toni und Max geholfen hast! Ende.'}
  ]}
// Lautgetreue Wörter: jeder Buchstabe = ein Laut (für Leseanfänger)
const WORDS=[['HUT','👒','ein'],['OMA','👵','eine'],['OPA','👴','ein'],['SOFA','🛋️','ein'],['NASE','👃','eine'],['LAMA','🦙','ein'],
 ['HAND','✋','eine'],['ENTE','🦆','eine'],['IGEL','🦔','ein'],['MOND','🌙','der'],['ROSE','🌹','eine'],['HOSE','👖','eine'],
 ['DOSE','🥫','eine'],['TOR','🥅','ein'],['ZELT','⛺','ein'],['BUS','🚌','ein'],['PILZ','🍄','ein'],['FILM','🎞️','ein'],
 ['WAL','🐋','ein'],['HASE','🐇','ein'],['LUPE','🔍','eine'],['UHU','🦉','ein'],['KANU','🛶','ein'],['SALZ','🧂',''],
 ['DINO','🦕','ein'],['LIMO','🥤','eine'],['ARM','💪','ein'],['LOK','🚂','eine'],['TUBE','🧴','eine'],['SAFT','🧃','ein']];
let picked=[];
let step=0;

function go(i){step=i;const s=STEPS[i];if(!s)return;
  if(s.t==='story')storyStep(s.text,s.sc,true);
  else if(s.t==='word')wordStep(s);
  else if(s.t==='rain')rainStep();
  else if(s.t==='drink')drinkStep(s);
  else if(s.t==='jump')jumpStep(s);
  else if(s.t==='reward')rewardStep();
  else if(s.t==='end')endStep(s);
}
function storyStep(text,sc,withNext){show('story');$('scene').innerHTML=scene(sc);$('text').textContent=text;
  $('nextBtn').classList.toggle('hide',!withNext);say(text,300)}
$('nextBtn').addEventListener('click',()=>{audio();go(step+1)});

// ---------- Versorgen ----------
const HEARTS=`<g id="hearts" fill="#FF6B8B" opacity="0"><path d="M300 40 c-6 -10 -20 -2 -10 8 l10 9 l10 -9 c10 -10 -4 -18 -10 -8z"/><path d="M335 70 c-4 -7 -14 -1 -7 6 l7 6 l7 -6 c7 -7 -3 -13 -7 -6z"/><path d="M262 62 c-4 -7 -14 -1 -7 6 l7 6 l7 -6 c7 -7 -3 -13 -7 -6z"/></g>`;
function drinkStep(s){
  const it=getItems();
  if(CH==='muede'){ // Schlafen im Stall
    storyStep(s.text,{man:1,barn:1,sky:'#3B4A7A',bg:'<circle cx="340" cy="45" r="20" fill="#FFF3B0"/><circle cx="60" cy="40" r="2" fill="#fff"/><circle cx="250" cy="30" r="2" fill="#fff"/><circle cx="290" cy="70" r="2" fill="#fff"/>',
      horse:{items:it,sleep:1},extra:`<ellipse cx="250" cy="222" rx="95" ry="12" fill="#E8C14A"/><g id="zzz" font-family="-apple-system,system-ui" font-weight="900" fill="#fff" opacity="0"><text x="345" y="80" font-size="22">Z</text><text x="362" y="60" font-size="28">Z</text><text x="380" y="36" font-size="34">Z</text></g>`},false);
    const hp=document.getElementById('horsePos');hp.setAttribute('transform','translate(240 168) scale(.85)');
    document.getElementById('hhead').setAttribute('transform','rotate(20 55 -10)');
    let t0=null;function anim(now){if(!t0)t0=now;const t=(now-t0)/1000;
      document.getElementById('zzz').setAttribute('opacity',Math.min(1,t/1.5)*(0.6+0.4*Math.sin(t*3)));
      if(t<4)requestAnimationFrame(anim);else $('nextBtn').classList.remove('hide')}
    requestAnimationFrame(anim);return}
  storyStep(s.text,{man:1,horse:{items:it},bucket:1,bucketX:335,cont:CH,bg:CH==='durst'?sun(160,45):'',extra:HEARTS},false);
  let happy=false;
  const head=document.getElementById('hhead'),bw=document.querySelector('#bucketG #bw');
  let t0=null,lastSlurp=0;
  function anim(now){if(!t0)t0=now;const t=(now-t0)/1000;
    const down=Math.min(1,t/0.8), up=t>4.6?Math.min(1,(t-4.6)/0.8):0, a=62*down*(1-up)+ (t>0.8&&t<4.6?Math.sin(t*8)*3:0);
    head.setAttribute('transform',`rotate(${a} 55 -10)`);
    const fill=Math.max(0,1-Math.max(0,t-0.8)/3.6);bw.setAttribute('y',-46*fill);
    if(t>0.8&&t<4.4&&now-lastSlurp>450){CH==='hunger'?tone(200,120,.08,'square',.12):slurp();lastSlurp=now}
    if(t>5.4&&!happy){happy=true;neigh();document.getElementById('hearts').setAttribute('opacity',1);
      head.insertAdjacentHTML('beforeend','<path d="M106 -48 Q114 -42 122 -46" stroke="#3B2412" stroke-width="2.5" fill="none" stroke-linecap="round"/>')}
    if(t<6.5)requestAnimationFrame(anim);else $('nextBtn').classList.remove('hide');
  }
  requestAnimationFrame(anim);
}
// ---------- Belohnung: Max wächst mit ----------
function rewardStep(){
  nextCh();
  let n=getItems();
  if(n>=REWARDS.length){storyStep('Max hat schon alles bekommen, was ein Pferd braucht. Er ist das glücklichste Pferd der Welt!',{man:1,horse:{items:n,happy:1},extra:HEARTS.replace('opacity="0"','')},true);return}
  n++;setItems(n);const r=REWARDS[n-1];
  storyStep(`Zur Belohnung bekommt Max ${r[0]}${r[1]?' '+r[1]:''}!`,{man:1,horse:{items:n,happy:1},
    extra:`<g fill="#FFD23F"><path d="M250 40 l4 10 l10 4 l-10 4 l-4 10 l-4 -10 l-10 -4 l10 -4z"/><path d="M340 90 l3 7 l7 3 l-7 3 l-3 7 l-3 -7 l-7 -3 l7 -3z"/><path d="M200 70 l3 7 l7 3 l-7 3 l-3 7 l-3 -7 l-7 -3 l7 -3z"/></g>`},true);
  jubel();
}
// ---------- Wegspringen ----------
function jumpStep(s){
  storyStep(s.text,{man:1,horse:{happy:1},bucket:0,bucketX:335,bg:sun(160,45),
    extra:`<g id="hearts" fill="#FF6B8B" opacity="0"><path d="M300 40 c-6 -10 -20 -2 -10 8 l10 9 l10 -9 c10 -10 -4 -18 -10 -8z"/><path d="M335 70 c-4 -7 -14 -1 -7 6 l7 6 l7 -6 c7 -7 -3 -13 -7 -6z"/></g>`},false);
  const hp=document.getElementById('horsePos'),hearts=document.getElementById('hearts');
  setTimeout(()=>{neigh();hearts.setAttribute('opacity',1)},600);
  let t0=null;
  function anim(now){if(!t0)t0=now;const t=(now-t0)/1000-1.6;
    if(t>0){const x=240+t*170, hop=Math.abs(Math.sin(t*5))*45;hp.setAttribute('transform',`translate(${x} ${146-hop}) scale(.85)`);
      document.getElementById('hhead').setAttribute('transform',`rotate(${-10+Math.sin(t*10)*6} 55 -10)`)}
    if(t<2.6)requestAnimationFrame(anim);else $('nextBtn').classList.remove('hide');
  }
  requestAnimationFrame(anim);
}
function endStep(s){
  show('story');$('scene').innerHTML=scene({man:1,horse:{items:getItems(),happy:1},bg:sun(340,45),
    extra:`<text x="160" y="60" font-size="44" font-weight="900" fill="#FF8A3D" text-anchor="middle" font-family="-apple-system,system-ui">Ende</text>`});
  $('text').textContent=s.text;jubel();say(s.text,500);
  $('nextBtn').classList.remove('hide');$('nextBtn').textContent='↻';
  $('nextBtn').onclick=()=>{$('nextBtn').textContent='➜';$('nextBtn').onclick=null;showStart()};
}

// ================= Wörter legen =================
const SPOKEN={A:'a',B:'bö',C:'kö',D:'dö',E:'e',F:'fff',G:'gö',H:'hö',I:'i',J:'jö',K:'kö',L:'lll',M:'mmm',N:'nnn',O:'o',
  P:'pö',Q:'kwö',R:'rrr',S:'sss',T:'tö',U:'u',V:'fff',W:'www',X:'ks',Y:'ü',Z:'tsö','Ä':'ä','Ö':'ö','Ü':'ü'}; // Laute statt Buchstabennamen
let word='',wname='',filled=[],tiles=[],wbusy=false;
function wordStep(st){
  const w=picked[st.n],name=w[0].charAt(0)+w[0].slice(1).toLowerCase(),s={word:w[0],q:'Das ist …',hint:`<div style="font-size:min(30vw,130px);line-height:1;height:100%;display:flex;align-items:center;justify-content:center">${w[1]}</div>`,speak:`Das ist ${w[2]} ${name}`.replace('  ',' ')};
  show('wordScreen');word=s.word;wname=name;wbusy=true;
  $('hint').innerHTML=s.hint;$('wq').textContent=`Wort ${st.k+1} von ${st.of}`;$('wmsg').textContent='';$('tray').innerHTML='';
  const W=Math.min(innerWidth,600)-28;document.documentElement.style.setProperty('--t',Math.floor(Math.min(62,(W-6*(word.length-1))/word.length))+'px');
  $('slots').innerHTML=[...word].map(ch=>`<div class="slot show">${ch}</div>`).join('');
  say(s.speak,300);
  setTimeout(()=>document.querySelectorAll('#slots .slot').forEach(x=>x.classList.add('flyout')),2600);
  setTimeout(()=>{
    filled=Array(word.length).fill(null);
    $('slots').innerHTML=[...word].map((_,i)=>`<div class="slot" data-i="${i}"></div>`).join('');
    let order;do{order=shuffle([...word])}while(order.join('')===word);
    tiles=order.map((ch,k)=>({ch,k}));
    $('tray').innerHTML=tiles.map(t=>`<div class="tile" data-k="${t.k}">${t.ch}</div>`).join('');
    $('tray').querySelectorAll('.tile').forEach(el=>{
      el.style.transform=`translate(${(Math.random()*120-60)|0}px,${(Math.random()*-160-60)|0}px) rotate(${(Math.random()*60-30)|0}deg)`;
      requestAnimationFrame(()=>requestAnimationFrame(()=>el.style.transform=''));
      el.addEventListener('click',()=>tapTile(+el.dataset.k))});
    document.querySelectorAll('#slots .slot').forEach(x=>x.addEventListener('click',()=>tapSlot(+x.dataset.i)));
    $('wmsg').textContent='Leg das Wort!';wbusy=false;
  },3400);
}
function tapTile(k){if(wbusy)return;const i=filled.indexOf(null);if(i<0)return;
  const t=tiles.find(t=>t.k===k);filled[i]=t;document.querySelector(`.tile[data-k="${k}"]`).classList.add('gone');
  const s=document.querySelector(`.slot[data-i="${i}"]`);s.textContent=t.ch;s.className='slot full';say(SPOKEN[t.ch]||t.ch);
  if(!filled.includes(null))checkWord()}
function tapSlot(i){if(wbusy||!filled[i])return;const t=filled[i];filled[i]=null;
  document.querySelector(`.tile[data-k="${t.k}"]`).classList.remove('gone');const s=document.querySelector(`.slot[data-i="${i}"]`);s.textContent='';s.className='slot'}
function checkWord(){wbusy=true;const wrong=filled.map((t,i)=>t.ch!==word[i]?i:-1).filter(i=>i>=0);
  setTimeout(()=>{
    if(!wrong.length){
      // Laute langsam zusammenziehen: jeder Buchstabe leuchtet auf, dann das ganze Wort
      const slots=[...document.querySelectorAll('#slots .slot')];slots.forEach(x=>x.className='slot ok');$('wmsg').textContent='Lies mit!';
      const gap=750;
      slots.forEach((x,i)=>setTimeout(()=>{slots.forEach(y=>y.classList.remove('lit'));x.classList.add('lit');say(SPOKEN[word[i]]||word[i])},i*gap));
      setTimeout(()=>{slots.forEach(y=>y.classList.add('lit'));say(wname);$('wmsg').textContent=wname+'! 🎉'},word.length*gap+200);
      setTimeout(()=>{jubel();slots.forEach(y=>y.classList.remove('lit'))},word.length*gap+1300);
      setTimeout(()=>go(step+1),word.length*gap+2800)}
    else{
      // Hilfe: welcher Laut kommt als Nächstes?
      const i=wrong[0],snd=SPOKEN[word[i]]||word[i];
      const hint=i===0?`Hör mal: ${wname}. Mit welchem Laut fängt es an?`:`Hör mal: ${wname}. Was kommt nach dem ${SPOKEN[word[i-1]]||word[i-1]}?`;
      $('wmsg').textContent='Hör genau hin!';say(hint);
      wrong.forEach(j=>document.querySelector(`.slot[data-i="${j}"]`).className='slot bad');
      setTimeout(()=>{wbusy=false;wrong.forEach(j=>tapSlot(j));
        const t=tiles.find(t=>t.ch===word[i]&&!filled.includes(t));const el=t&&document.querySelector(`.tile[data-k="${t.k}"]`);
        if(el){el.classList.add('glow');setTimeout(()=>el.classList.remove('glow'),2500)}},900)}
  },700)}

// ================= Regentropfen =================
const GOAL=20,cv=$('c'),ctx=cv.getContext('2d');
let RW,RH,bk,items=[],score=0,spawned=0,running=false,last=0,spawnT=0,shakeT=0,splashes=[];
function rsize(){const d=devicePixelRatio||1;RW=innerWidth;RH=innerHeight;cv.width=RW*d;cv.height=RH*d;ctx.setTransform(d,0,0,d,0,0);
  const w=Math.min(130,RW*.32);bk=bk?{...bk,w}:{x:RW/2,tx:RW/2,w};bk.y=RH-130}
addEventListener('resize',()=>{if(running)rsize()});
function mv(e){const t=e.touches?e.touches[0]:e;if(t)bk.tx=Math.max(bk.w/2,Math.min(RW-bk.w/2,t.clientX))}
cv.addEventListener('touchstart',e=>{mv(e);e.preventDefault()},{passive:false});
cv.addEventListener('touchmove',e=>{mv(e);e.preventDefault()},{passive:false});
cv.addEventListener('mousemove',e=>{if(e.buttons)mv(e)});
function rainStep(){show('rain');audio();rsize();items=[];splashes=[];score=0;spawned=0;spawnT=0;shakeT=0;bk.x=bk.tx=RW/2;running=true;last=performance.now();requestAnimationFrame(rloop)}
function rloop(now){if(!running)return;const dt=Math.min(.05,(now-last)/1000);last=now;const p=spawned/GOAL;
  spawnT-=dt;if(spawnT<=0&&spawned<GOAL){const st=p>.1&&Math.random()<.18;if(!st)spawned++;items.push({x:20+Math.random()*(RW-40),y:-30,v:(160+200*p)*(.85+Math.random()*.3),st,r:st?16:13,rot:Math.random()*6});spawnT=(1-.5*p)*(.7+Math.random()*.6)}
  bk.x+=(bk.tx-bk.x)*Math.min(1,dt*18);if(shakeT>0)shakeT-=dt;
  const rim=bk.y-bk.w*.4;
  for(const it of items){const prev=it.y;it.y+=it.v*dt;it.rot+=dt*2;
    if(!it.hit&&prev<rim&&it.y>=rim&&Math.abs(it.x-bk.x)<bk.w/2+it.r*.4){it.hit=true;
      if(it.st){score=Math.max(0,score-1);shakeT=.4;bonk();if(navigator.vibrate)navigator.vibrate(80)}else{score++;catchSound();if(CH==='durst')splashes.push({x:it.x,y:rim,t:0})}}}
  items=items.filter(it=>!it.hit&&it.y<RH+40);splashes.forEach(s=>s.t+=dt);splashes=splashes.filter(s=>s.t<.4);
  rdraw(now);
  if(spawned>=GOAL&&!items.some(i=>!i.st)){running=false;items=[];
    if(score>=18){jubel();setTimeout(()=>go(step+1),900)}
    else{const rainIdx=step;setTimeout(()=>{storyStep(`Du hast ${score} gefangen. Du brauchst mindestens 18. Probier es nochmal!`,{man:1,horse:{items:getItems()},bucket:Math.min(1,score/GOAL),bucketX:170,cont:CH},true);step=rainIdx-1},700)}
    return}
  requestAnimationFrame(rloop)}
function rdrop(x,y,r){ctx.fillStyle='#3B8EEA';ctx.beginPath();ctx.moveTo(x,y-r*1.8);ctx.bezierCurveTo(x+r*.9,y-r*.5,x+r,y+r*.2,x,y+r);ctx.bezierCurveTo(x-r,y+r*.2,x-r*.9,y-r*.5,x,y-r*1.8);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.7)';ctx.beginPath();ctx.ellipse(x-r*.35,y-r*.1,r*.18,r*.35,-.3,0,7);ctx.fill()}
function rstone(x,y,r,rot){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.fillStyle='#8A8F98';ctx.beginPath();ctx.moveTo(-r,-r*.2);ctx.lineTo(-r*.5,-r*.9);ctx.lineTo(r*.5,-r*.8);ctx.lineTo(r,-r*.1);ctx.lineTo(r*.6,r*.8);ctx.lineTo(-r*.6,r*.8);ctx.closePath();ctx.fill();ctx.restore()}
function rcarrot(x,y,r,rot){ctx.save();ctx.translate(x,y);ctx.rotate(Math.sin(rot)*.4);ctx.fillStyle='#FF8A3D';ctx.beginPath();ctx.moveTo(-r*.6,-r);ctx.lineTo(r*.6,-r);ctx.lineTo(0,r*1.6);ctx.closePath();ctx.fill();
  ctx.fillStyle='#4CA66A';ctx.beginPath();ctx.ellipse(-4,-r-7,3,8,-.4,0,7);ctx.ellipse(4,-r-7,3,8,.4,0,7);ctx.fill();ctx.restore()}
function rstraw(x,y,r,rot){ctx.save();ctx.translate(x,y);ctx.rotate(Math.sin(rot)*.5);ctx.fillStyle='#E8C14A';ctx.fillRect(-r*.7,-r*1.3,r*1.4,r*2.6);
  ctx.strokeStyle='#C99A26';ctx.lineWidth=2;for(let i=-1;i<=1;i++){ctx.beginPath();ctx.moveTo(i*r*.4,-r*1.3);ctx.lineTo(i*r*.4,r*1.3);ctx.stroke()}
  ctx.fillStyle='#B5651D';ctx.fillRect(-r*.8,-3,r*1.6,6);ctx.restore()}
function rcloud(x,y,s){ctx.fillStyle='#9AA6B5';[[0,0,30],[28,-12,34],[60,0,28],[30,10,30]].forEach(([dx,dy,r])=>{ctx.beginPath();ctx.arc(x+dx*s,y+dy*s,r*s,0,7);ctx.fill()})}
function rdraw(now){const g=ctx.createLinearGradient(0,0,0,RH);const SK={durst:['#8FA9C4','#D3E4F2'],hunger:['#8EC9F5','#DDF1FF'],muede:['#F29E6B','#FFD9A8']}[CH];g.addColorStop(0,SK[0]);g.addColorStop(1,SK[1]);ctx.fillStyle=g;ctx.fillRect(0,0,RW,RH);
  if(CH==='durst'){const off=(now/80)%(RW+200);rcloud(RW-off,70,1);rcloud((RW*.5-off*.6+RW+200)%(RW+200)-100,45,.8)}
  ctx.fillStyle='#7CC46A';ctx.fillRect(0,bk.y+4,RW,RH);
  for(const it of items)it.st?rstone(it.x,it.y,it.r,it.rot):(CH==='hunger'?rcarrot(it.x,it.y,it.r,it.rot):CH==='muede'?rstraw(it.x,it.y,it.r,it.rot):rdrop(it.x,it.y,it.r));
  // Eimer
  const sx=shakeT>0?Math.sin(now/25)*6:0,x=bk.x+sx,y=bk.y,w=bk.w,h=w*.8,top=y-h;
  if(CH!=='muede'){ctx.strokeStyle=CH==='hunger'?'#8B5A2B':'#777';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(x-w/2,top);ctx.quadraticCurveTo(x,top-w*.6,x+w/2,top);ctx.stroke()}
  ctx.save();ctx.beginPath();ctx.moveTo(x-w/2,top);ctx.lineTo(x+w/2,top);ctx.lineTo(x+w*.4,y);ctx.lineTo(x-w*.4,y);ctx.closePath();ctx.fillStyle=CONT[CH].box;ctx.fill();ctx.clip();
  const lvl=y-h*.95*Math.min(1,score/GOAL);ctx.fillStyle=CONT[CH].fill;ctx.fillRect(x-w/2,lvl+Math.sin(now/200)*1.5,w,h);ctx.restore();
  ctx.fillStyle=CONT[CH].rim;ctx.fillRect(x-w/2-2,top-4,w+4,8);if(CONT[CH].wheel){ctx.fillStyle='#444';ctx.beginPath();ctx.arc(x,y+8,12,0,7);ctx.fill()}
  ctx.fillStyle='#7FC0FF';splashes.forEach(s=>{for(let i=0;i<5;i++){const a=Math.PI*(1.1+i*.2),d=s.t*90;ctx.beginPath();ctx.arc(s.x+Math.cos(a)*d,s.y+Math.sin(a)*d+s.t*s.t*200,3,0,7);ctx.fill()}});
  ctx.fillStyle='rgba(255,255,255,.9)';const tw=150,tx=RW-tw-12,ty=54;ctx.beginPath();ctx.roundRect?ctx.roundRect(tx,ty,tw,46,16):ctx.rect(tx,ty,tw,46);ctx.fill();
  ctx.fillStyle='#2B3A55';ctx.font='800 24px -apple-system,system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(`${CHAPTERS[CH].icon} ${score} / ${GOAL}`,tx+tw/2,ty+23)}

// ================= Start =================
function showStart(){const n=getItems();
  $('startPic').innerHTML=scene({man:1,horse:{items:n},bg:sun(160,45)+cloudG(300,40,.7)});
  $('items').textContent=n?`Max hat schon ${n} von ${REWARDS.length} Geschenken`:'Max braucht deine Hilfe!';show('start')}
$('go').addEventListener('click',()=>{audio();if('speechSynthesis' in window){const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u)}
  CH=getCh();buildSteps();picked=shuffle(WORDS.slice()).slice(0,NW);go(0)});
showStart();
document.querySelectorAll('[data-home]').forEach(b=>b.addEventListener('click',()=>{running=false;if('speechSynthesis' in window)speechSynthesis.cancel();showStart()}));
if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js');
document.addEventListener('gesturestart',e=>e.preventDefault());
</script>
