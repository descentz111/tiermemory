<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tier-Memory">
<title>Tier-Memory</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#FFF6E5">
<style>
  :root{
    --bg:#FFF6E5; --ink:#3B2F2A; --accent:#FF8A3D; --green:#5BB87A; --back1:#4F8EDC; --back2:#3A74C0;
    --s:80px;
  }
  @font-face{font-family:Schul;src:url(schulschrift.woff2) format('woff2');font-weight:700;font-display:swap}
  .letter,.letter i,.word,.li div,.badge{font-family:Schul,-apple-system,system-ui,sans-serif!important;font-weight:700}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:-apple-system,"SF Pro Rounded","Arial Rounded MT Bold",system-ui,sans-serif;overflow:hidden;touch-action:manipulation}
  body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  .screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;
    padding:calc(env(safe-area-inset-top) + 12px) 12px calc(env(safe-area-inset-bottom) + 12px)}
  .screen.on{display:flex}

  /* Start */
  #start{justify-content:center;gap:22px;text-align:center}
  #start h1{font-size:44px;margin:0;letter-spacing:.5px}
  #start .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .hero{display:flex;gap:6px}
  .hero svg{width:70px;height:70px}
  .btn{border:0;border-radius:22px;padding:18px 26px;font:inherit;font-size:24px;font-weight:800;color:#fff;
    background:var(--accent);box-shadow:0 5px 0 #D96A22;cursor:pointer}
  .btn:active{transform:translateY(4px);box-shadow:0 1px 0 #D96A22}
  .btn.g{background:var(--green);box-shadow:0 5px 0 #3F9560}
  .btn.b{background:var(--back1);box-shadow:0 5px 0 var(--back2)}
  .btn small{display:block;font-size:14px;font-weight:600;opacity:.9}

  /* Spiel */
  #game header{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
  .pill{background:#fff;border-radius:16px;padding:8px 14px;font-size:18px;font-weight:800;box-shadow:0 2px 0 #EBDCC2}
  .home{border:0;background:#fff;border-radius:16px;width:46px;height:42px;font-size:22px;box-shadow:0 2px 0 #EBDCC2}
  #board{display:grid;grid-template-columns:repeat(4,var(--s));gap:8px;justify-content:center;align-content:center;flex:1}
  .card{width:var(--s);height:calc(var(--s)*1.18);perspective:600px;cursor:pointer}
  .inner{position:relative;width:100%;height:100%;transition:transform .35s;transform-style:preserve-3d}
  .card.up .inner{transform:rotateY(180deg)}
  .face{position:absolute;inset:0;border-radius:14px;backface-visibility:hidden;-webkit-backface-visibility:hidden;
    display:flex;align-items:center;justify-content:center}
  .back{background:repeating-linear-gradient(45deg,var(--back1) 0 10px,var(--back2) 10px 20px);
    box-shadow:0 4px 0 #2C5E9E;border:3px solid #fff}
  .back span{width:44%;height:44%;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;
    color:var(--back1);font-weight:900;font-size:calc(var(--s)*.26)}
  .front{background:#fff;transform:rotateY(180deg);box-shadow:0 4px 0 #E3D3B8;border:3px solid #fff}
  .front svg{width:86%;height:86%}
  .card.done .front{border-color:var(--green);box-shadow:0 4px 0 #3F9560}
  .badge{position:absolute;top:-6px;right:-6px;min-width:calc(var(--s)*.34);height:calc(var(--s)*.34);border-radius:50%;
    background:var(--green);color:#fff;font-weight:900;font-size:calc(var(--s)*.22);display:none;align-items:center;justify-content:center;
    border:2px solid #fff}
  .card.done .badge{display:flex}
  .card.shake .inner{animation:shake .35s}
  @keyframes shake{0%,100%{transform:rotateY(180deg) translateX(0)}25%{transform:rotateY(180deg) translateX(5px)}75%{transform:rotateY(180deg) translateX(-5px)}}

  /* Paar-Einblendung */
  #pop{position:fixed;inset:0;background:rgba(59,47,42,.45);display:none;align-items:center;justify-content:center;z-index:10}
  #pop.on{display:flex}
  .popbox{background:#fff;border-radius:30px;padding:22px 26px 26px;text-align:center;width:min(86vw,360px);animation:pop .35s ease-out}
  @keyframes pop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
  .popbox svg{width:58%;height:auto}
  .letter{font-size:96px;font-weight:900;line-height:1;color:var(--accent)}
  .letter i{font-style:normal;font-size:64px;color:#E8A06A;margin-left:8px}
  .word{font-size:34px;font-weight:800;margin-top:4px}
  .word b{color:var(--accent)}
  .hint{font-size:14px;opacity:.5;margin-top:10px}

  /* Ende */
  #end{gap:12px;text-align:center;overflow-y:auto}
  #end h2{font-size:34px;margin:6px 0 0}
  #end p{margin:0;font-size:18px;font-weight:700}
  #podium{display:flex;align-items:flex-end;gap:6px;margin-top:4px}
  .step{width:84px;display:flex;flex-direction:column;align-items:center;opacity:.45}
  .step .who{font-size:34px;visibility:hidden}
  .step .blk{width:100%;border-radius:10px 10px 0 0;color:#fff;font-size:30px;font-weight:900;display:flex;align-items:flex-start;justify-content:center;padding-top:6px}
  .step[data-p="1"] .blk{height:96px;background:#F4B400}
  .step[data-p="2"] .blk{height:70px;background:#A7B1BC}
  .step[data-p="3"] .blk{height:50px;background:#CD7F32}
  .step small{font-size:12px;font-weight:700;margin-top:3px}
  .step.me{opacity:1}
  .step.me .who{visibility:visible;animation:pop .5s ease-out}
  #placeTxt{font-size:30px;font-weight:900;color:var(--accent)}
  #list{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:420px}
  .li{background:#fff;border-radius:16px;padding:6px 4px 8px;box-shadow:0 3px 0 #E3D3B8}
  .li svg{width:70%;height:auto}
  .li div{font-weight:800;font-size:16px}
  .li div b{color:var(--accent);font-size:22px}
</style>
</head>
<body>

<section id="start" class="screen on">
  <div class="hero" id="hero"></div>
  <h1>Tier-Memory</h1>
  <div class="row">
    <button class="btn g" data-p="8">8<small>Paare</small></button>
    <button class="btn" data-p="10">10<small>Paare</small></button>
    <button class="btn b" data-p="12">12<small>Paare</small></button>
  </div>
</section>

<section id="game" class="screen">
  <header>
    <button class="home" id="homeBtn" aria-label="Zurück">🏠</button>
    <div class="pill" id="pairs">0 / 8</div>
    <div class="pill" id="moves">Züge: 0</div>
  </header>
  <div id="board"></div>
</section>

<section id="end" class="screen">
  <h2>Super gemacht! 🎉</h2>
  <p id="endInfo"></p>
  <div id="podium">
    <div class="step" data-p="2"><div class="who">⭐</div><div class="blk">2</div><small>unter 25</small></div>
    <div class="step" data-p="1"><div class="who">⭐</div><div class="blk">1</div><small>unter 20</small></div>
    <div class="step" data-p="3"><div class="who">⭐</div><div class="blk">3</div><small>ab 25</small></div>
  </div>
  <div id="placeTxt"></div>
  <div id="list"></div>
  <button class="btn g" id="againBtn">Nochmal</button>
  <button class="btn b" id="menuBtn" style="margin-bottom:10px">Andere Größe</button>
</section>

<div id="pop"><div class="popbox" id="popbox"></div></div>

const smile=(x,y,w=8)=>`<path d="M${x-w} ${y} Q${x} ${y+w*.8} ${x+w} ${y}" fill="none" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>`;
const cheeks=(y,dx=17)=>`<circle cx="${50-dx}" cy="${y}" r="4.5" fill="#FF9AA8" opacity=".6"/><circle cx="${50+dx}" cy="${y}" r="4.5" fill="#FF9AA8" opacity=".6"/>`;

function spikes(cx,cy,rx,ry,n,len,a0,a1){let p=[];for(let i=0;i<=n*2;i++){const a=a0+(a1-a0)*i/(n*2);const k=i%2?1+len:1;p.push((cx+Math.cos(a)*rx*k).toFixed(1)+','+(cy+Math.sin(a)*ry*k).toFixed(1))}return p.join(' ')}
function mane(){let s='';for(let i=0;i<14;i++){const a=i/14*Math.PI*2;s+=`<circle cx="${(50+Math.cos(a)*30).toFixed(1)}" cy="${(52+Math.sin(a)*30).toFixed(1)}" r="11" fill="${i%2?'#D9661A':'#E8812A'}"/>`}return s}

  <ellipse cx="40" cy="86" rx="6" ry="3.5" fill="#D9B48A"/><ellipse cx="70" cy="86" rx="6" ry="3.5" fill="#D9B48A"/>`},

  <path d="M30 62 L14 59 M30 66 L14 68 M70 62 L86 59 M70 66 L86 68" stroke="#7A5230" stroke-width="1.6" stroke-linecap="round"/>`},

const sch=t=>String(t); // Schul-a (einstöckig)
const svgOf=a=>`<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">${a.svg}</svg>`;
const L=a=>a.n[0].toUpperCase();

// ---------- Sprache ----------
let voice=null;
function pickVoice(){const v=speechSynthesis.getVoices().filter(x=>x.lang&&x.lang.toLowerCase().startsWith('de'));
  voice=v.find(x=>/Anna|Helena|Petra|Marlene/i.test(x.name))||v[0]||null}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function say(t){if(!('speechSynthesis' in window))return;speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(t);u.lang='de-DE';if(voice)u.voice=voice;u.rate=.85;u.pitch=1.1;speechSynthesis.speak(u)}
// Buchstabe als deutscher Buchstabenname, damit er sauber gesprochen wird
const LETTER_SPOKEN={A:'Ah',B:'Beh',E:'Eh',F:'Eff',G:'Geh',H:'Hah',I:'Ih',K:'Kah',L:'Ell',M:'Emm',P:'Peh',S:'Ess',T:'Teh',U:'Uh'};
let sayTimer=null;
function sayLetterThenName(a){
  if(!('speechSynthesis' in window))return;
  speechSynthesis.cancel();clearTimeout(sayTimer);
  const mk=t=>{const u=new SpeechSynthesisUtterance(t);u.lang='de-DE';if(voice)u.voice=voice;u.rate=.8;u.pitch=1.1;return u};
  const u1=mk(L(a)+'.');
  window._u1=u1; // Referenz halten, sonst verwirft iOS die Ausgabe manchmal
  let done=false;
  const next=()=>{if(done)return;done=true;sayTimer=setTimeout(()=>speechSynthesis.speak(mk(a.n)),1000)};
  u1.onend=next;
  // erst 0,5 s warten, damit die Sprachausgabe bereit ist, dann Buchstabe
  sayTimer=setTimeout(()=>{
    speechSynthesis.speak(u1);
    setTimeout(next,2500); // Sicherheitsnetz, falls onend auf dem iPhone ausbleibt
  },500);
}
function unlockSpeech(){if('speechSynthesis' in window){const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u)}}

// ---------- Spiel ----------
const $=id=>document.getElementById(id);
let pairs=8,deck=[],open=[],lock=false,moves=0,found=[];
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id))}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function newGame(p){
  pairs=p;moves=0;open=[];lock=false;found=[];
  const pick=shuffle(ANIMALS.slice()).slice(0,pairs);
  deck=shuffle(pick.concat(pick).map(a=>({a})));
  const b=$('board');b.innerHTML='';
  deck.forEach((c,i)=>{
    const el=document.createElement('div');el.className='card';
    el.innerHTML=`<div class="inner"><div class="face back"><span>?</span></div><div class="face front">${svgOf(c.a)}<div class="badge">${L(c.a)}</div></div></div>`;
    el.addEventListener('click',()=>tap(i));c.el=el;b.appendChild(el)});
  updHud();show('game');fit();
}
function updHud(){$('pairs').textContent=`${found.length} / ${pairs}`;$('moves').textContent=`Züge: ${moves}`}

function tap(i){
  const c=deck[i];
  if(lock||c.done||open.includes(c))return;
  c.el.classList.add('up');open.push(c);
  if(open.length<2)return;
  moves++;updHud();
  const [x,y]=open;
  if(x.a===y.a){
    x.done=y.done=true;open=[];found.push(x.a);
    sayLetterThenName(x.a);                  // direkt im Tipp-Ereignis -> klappt auf dem iPhone
    setTimeout(()=>{x.el.classList.add('done');y.el.classList.add('done');updHud();popup(x.a)},380);
  }else{
    lock=true;
    setTimeout(()=>{x.el.classList.add('shake');y.el.classList.add('shake')},450);
    setTimeout(()=>{x.el.classList.remove('up','shake');y.el.classList.remove('up','shake');open=[];lock=false},1150);
  }
}

let popTimer=null;
function popup(a){
  lock=true;
  $('popbox').innerHTML=`${svgOf(a)}<div class="letter">${L(a)}<i>${sch(L(a).toLowerCase())}</i></div>
    <div class="word"><b>${a.n[0]}</b>${sch(a.n.slice(1))}</div><div class="hint">Tippen zum Weiterspielen</div>`;
  $('pop').classList.add('on');
  clearTimeout(popTimer);popTimer=setTimeout(closePop,4000);
}
function closePop(){
  if(!$('pop').classList.contains('on'))return;
  clearTimeout(popTimer);$('pop').classList.remove('on');lock=false;
  if(found.length===pairs)setTimeout(finish,300);
}
$('pop').addEventListener('click',()=>{const a=found[found.length-1];closePop()});

function finish(){
  const place=moves<20?1:moves<25?2:3;
  $('endInfo').textContent=`Alle ${pairs} Paare in ${moves} Zügen gefunden!`;
  document.querySelectorAll('.step').forEach(s=>s.classList.toggle('me',+s.dataset.p===place));
  $('placeTxt').textContent=`Platz ${place}!`;
  $('list').innerHTML=found.slice().sort((a,b)=>a.n.localeCompare(b.n,'de')).map(a=>
    `<div class="li">${svgOf(a)}<div><b>${L(a)}</b> wie ${sch(a.n)}</div></div>`).join('');
  show('end');say(`Super gemacht! Platz ${place}!`);
}

// Kartengröße an Bildschirm anpassen
function fit(){
  const g=$('game');if(!g.classList.contains('on'))return;
  const rows=deck.length/4,gap=8;
  const W=g.clientWidth-24, H=g.clientHeight-$('game').querySelector('header').offsetHeight-40;
  const sW=(W-gap*3)/4, sH=(H-gap*(rows-1))/rows/1.18;
  document.documentElement.style.setProperty('--s',Math.floor(Math.min(sW,sH,150))+'px');
}
addEventListener('resize',fit);

// Buttons
document.querySelectorAll('#start .btn').forEach(b=>b.addEventListener('click',()=>{unlockSpeech();newGame(+b.dataset.p)}));
$('homeBtn').addEventListener('click',()=>show('start'));
$('againBtn').addEventListener('click',()=>{unlockSpeech();newGame(pairs)});
$('menuBtn').addEventListener('click',()=>show('start'));
$('hero').innerHTML=['Löwe','Katze','Pinguin'].map(n=>svgOf(ANIMALS.find(a=>a.n===n))).join('');
if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js');
document.addEventListener('gesturestart',e=>e.preventDefault());
</script>
<script src="zeit.js"></script>
