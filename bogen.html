<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bogenschütze">
<title>Bogenschütze</title>
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  @font-face{font-family:Schul;src:url(schulschrift.woff2) format('woff2');font-weight:700;font-display:swap}
  :root{--ink:#2F3B4A}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  html,body{margin:0;height:100%;overflow:hidden;touch-action:none;color:var(--ink);background:linear-gradient(#CFE8D0,#E8F4E0 55%,#BFDDA8);
    font-family:-apple-system,"SF Pro Rounded","Arial Rounded MT Bold",system-ui,sans-serif}
  .screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;
    padding:calc(env(safe-area-inset-top) + 10px) 12px calc(env(safe-area-inset-bottom) + 14px)}
  .screen.on{display:flex}
  .btn{border:0;border-radius:22px;padding:18px 34px;font:inherit;font-size:24px;font-weight:800;color:#fff;background:#3F9560;box-shadow:0 5px 0 #2A6B43}
  .btn:active{transform:translateY(4px);box-shadow:0 1px 0 #2A6B43}
  #start,#end{justify-content:center;gap:18px;text-align:center}
  h1{font-size:40px;margin:0} p{margin:0;font-size:20px;font-weight:700}
  .big{font-size:64px;line-height:1}
  header{width:100%;display:flex;justify-content:space-between;align-items:center}
  .home{border:0;background:#fff;border-radius:16px;width:46px;height:42px;font-size:22px;box-shadow:0 2px 0 #A9CBE3}
  #strip{display:flex;gap:3px;background:#fff;border-radius:16px;padding:6px 8px;box-shadow:0 2px 0 #A9CBE3}
  #strip span{width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:15px;border-radius:50%;background:#EAF3FA}
  #strip span.cur{box-shadow:0 0 0 3px #FFD23F}
  #task{font-family:Schul,-apple-system,system-ui,sans-serif;font-weight:700;font-size:56px;line-height:1;background:linear-gradient(#FBF1D8,#F1DFB4);border-radius:10px;
    padding:12px 30px;box-shadow:0 0 0 4px #C9A46A,0 7px 0 4px #8B5A2B;margin-top:12px;white-space:nowrap;color:#4A3420}
  #task .q{color:#E5534B;display:inline-block;min-width:.8em}
  #task.ok .q{color:#3F9560}
  #msg{font-size:22px;font-weight:800;min-height:30px;margin:8px 0 0;text-align:center}
  #cvWrap{flex:1;min-width:0;position:relative}
  #cv{position:absolute;inset:0;width:100%;height:100%}
  #playRow{flex:1;width:100%;min-height:0;display:flex;gap:6px;margin:6px 0 10px}
  #meter{position:relative;width:76px;flex:none}
  #meter .bar{position:absolute;left:30px;top:14px;bottom:14px;width:20px;border-radius:10px;background:#F1DFB4;box-shadow:0 0 0 4px #8B5A2B,0 3px 0 4px #5A3418;overflow:hidden;display:flex;align-items:flex-end}
  #meter .fill{width:100%;height:0;background:linear-gradient(0deg,#FFD23F,#E0661E)}
  #meter .ticks{position:absolute;left:0;width:26px;top:14px;bottom:14px;display:flex;flex-direction:column-reverse;justify-content:space-between;
    font-family:Schul,system-ui;font-weight:700;font-size:15px;text-align:right}
  #meter .ticks span{height:0;display:flex;align-items:center;justify-content:flex-end}
  #pow{position:absolute;left:52px;font-family:Schul,system-ui;font-weight:700;font-size:24px;color:#4A3420;transform:translateY(50%);background:radial-gradient(circle at 35% 30%,#FFE58A,#E0A800);
    width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 0 #9C7400,0 0 0 2px #fff}
  #hold{width:min(90vw,380px);height:84px;border:0;border-radius:26px;background:linear-gradient(#A0693A,#7A4A22);box-shadow:0 0 0 3px #E0A800,0 8px 0 3px #4A2E14;color:#FFE58A;text-shadow:0 2px 0 #4A2E14;font:inherit;font-size:26px;font-weight:800}
  #hold.down{background:linear-gradient(#C0392B,#8E2A1F);box-shadow:0 0 0 3px #E0A800,0 3px 0 3px #4A2E14;transform:translateY(5px)}
  #hold.wait{opacity:.5}
  #stars{display:flex;gap:10px;font-size:76px}
  #stars span{opacity:.18;filter:grayscale(1);transform:scale(.6);transition:all .45s cubic-bezier(.3,1.6,.5,1)}
  #stars span.on{opacity:1;filter:none;transform:scale(1)}
  #again{border:0;width:110px;height:110px;border-radius:50%;background:#5BB87A;color:#fff;font-size:54px;box-shadow:0 6px 0 #3F9560;padding-left:10px}
  #endInfo{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 8px);font-size:12px;color:#6F8296}
</style>
</head>
<body>

<section id="start" class="screen on">
  <div class="big">🌲🏹🎯</div>
  <h1>Bogenschütze</h1>
  <p>Rechne aus, wie weit die Scheibe ist.<br>Halte gedrückt und lass beim<br>richtigen Wert los!</p>
  <button class="btn" id="go">Los geht's!</button>
</section>

<section id="game" class="screen">
  <header>
    <button class="home" id="homeBtn">🏠</button>
    <div id="strip"></div>
    <div style="width:46px"></div>
  </header>
  <div id="task"></div>
  <div id="msg"></div>
  <div id="playRow">
    <div id="meter"><div class="ticks"></div><div class="bar"><div class="fill" id="fill"></div></div><div id="pow">0</div></div>
    <div id="cvWrap"><canvas id="cv"></canvas></div>
  </div>
  <button id="hold" class="wait">🏹 Gedrückt halten</button>
</section>

<section id="end" class="screen">
  <div class="big">🏹🎯</div>
  <div id="stars"><span>⭐</span><span>⭐</span><span>⭐</span></div>
  <button id="again" aria-label="Nochmal">▶</button>
  <div id="endInfo"></div>
</section>

<script>
const $=id=>document.getElementById(id);
const rand=n=>Math.floor(Math.random()*n);
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id))}
document.querySelector('#meter .ticks').innerHTML=Array.from({length:13},(_,i)=>`<span>${i}</span>`).join('');

// ---------- Sprache & Töne ----------
let voice=null;
function pickVoice(){const v=speechSynthesis.getVoices().filter(x=>x.lang&&x.lang.toLowerCase().startsWith('de'));
  voice=v.find(x=>/Anna|Helena|Petra|Marlene/i.test(x.name))||v[0]||null}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
let sayT=null;
function say(t,delay=250){if(!('speechSynthesis' in window))return;speechSynthesis.cancel();clearTimeout(sayT);
  const u=new SpeechSynthesisUtterance(t);u.lang='de-DE';if(voice)u.voice=voice;u.rate=.85;u.pitch=1.1;window._u=u;sayT=setTimeout(()=>speechSynthesis.speak(u),delay)}
let ac=null;
function audio(){if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(ac&&ac.state==='suspended')ac.resume()}
function tone(f,dur,type='sine',vol=.25,delay=0){if(!ac)return;const t=ac.currentTime+delay,o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;
  g.gain.setValueAtTime(.001,t);g.gain.linearRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+dur)}
function noise(dur,freq,vol){if(!ac)return;const b=ac.createBuffer(1,ac.sampleRate*dur,ac.sampleRate),x=b.getChannelData(0);
  for(let i=0;i<x.length;i++)x[i]=(Math.random()*2-1)*(1-i/x.length);const s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();
  s.buffer=b;f.type='bandpass';f.frequency.value=freq;g.gain.value=vol;s.connect(f).connect(g).connect(ac.destination);s.start()}
const twang=()=>{tone(180,.35,'triangle',.3);noise(.25,2500,.25)};
const thud=()=>{tone(140,.18,'sine',.5);noise(.06,900,.4)};
const ok=()=>{tone(659,.25,'sine',.25);tone(880,.35,'sine',.25,.12)};
const tick=n=>tone(300+n*60,.06,'square',.06);

// ---------- Aufgaben ----------
const ROUNDS=10,MAXV=12,FULL=3800;   // ms von 0 bis MAXV
let r=0,task=null,tries=0,res=[],firstTry=0,solved=0,gid=0,pow=0,holding=false,hStart=0,ready=false,arrow=null,stuck=[],lastTick=-1,seen=new Set();
function later(fn,ms){const g=gid;setTimeout(()=>{if(g===gid)fn()},ms)}
function makeTask(){for(let t=0;t<60;t++){let a,b,op;
  if(r<5||Math.random()<.5){op='+';a=1+rand(11);b=1+rand(12-a);if(a+b>MAXV||a+b<2)continue}else{op='−';a=3+rand(10);b=1+rand(a-2)}
  const k=a+op+b;if(seen.has(k))continue;seen.add(k);return{a,b,op,r:op==='+'?a+b:a-b}}return{a:3,b:4,op:'+',r:7}}
const spoken=t=>`${t.a} ${t.op==='+'?'plus':'minus'} ${t.b}`;
function drawStrip(){$('strip').innerHTML=Array.from({length:ROUNDS},(_,i)=>`<span class="${i===r&&res.length===i?'cur':''}">${res[i]||''}</span>`).join('')}

// ---------- Szene ----------
const cv=$('cv'),ctx=cv.getContext('2d');let W,H;
function resize(){const d=devicePixelRatio||1,b=$('cvWrap').getBoundingClientRect();W=b.width;H=b.height;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0)}
addEventListener('resize',()=>{if($('game').classList.contains('on'))resize()});
const gy=()=>H*.82,x0=()=>Math.max(28,W*.1),xs=v=>x0()+(W*.93-x0())*v/MAXV;
// ---------- Zeichnen: Waldlichtung ----------
let sparks=[],wob=0;
function draw(now){
  const t=now/1000,G=gy();
  let g=ctx.createLinearGradient(0,0,0,G);g.addColorStop(0,'#7DB9E8');g.addColorStop(1,'#D9EEFB');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // Wolken
  ctx.fillStyle='rgba(255,255,255,.9)';[[.15,.12,1],[.62,.08,.8]].forEach(([fx,fy,sc],k)=>{const cx=((fx*W+t*8*(k+1))%(W+120))-60,cy=fy*H;
    [[0,0,18],[18,-8,22],[38,0,17],[18,6,18]].forEach(([dx,dy,r])=>{ctx.beginPath();ctx.arc(cx+dx*sc,cy+dy*sc,r*sc,0,7);ctx.fill()})});
  // Waldrand hinten (zwei Reihen Bäume)
  forest(G*.62,'#4E8F55','#3F7A47',.75,1);forest(G*.74,'#3F7A47','#2F6338',1,2);
  // Lichtstrahlen
  ctx.save();ctx.globalAlpha=.12+.04*Math.sin(t);ctx.fillStyle='#FFF6C8';
  [[.3,.18],[.55,.12],[.78,.15]].forEach(([fx,w])=>{ctx.beginPath();ctx.moveTo(W*fx,0);ctx.lineTo(W*(fx+w),0);ctx.lineTo(W*(fx+w*1.8),G);ctx.lineTo(W*(fx+w*.6),G);ctx.fill()});ctx.restore();
  // Wiese
  g=ctx.createLinearGradient(0,G-8,0,H);g.addColorStop(0,'#86C96E');g.addColorStop(1,'#5FA850');ctx.fillStyle=g;ctx.fillRect(0,G-8,W,H);
  ctx.fillStyle='rgba(255,255,255,.07)';for(let x=0;x<W;x+=14){ctx.fillRect(x,G-8,2,6)}
  // Pilze, Blumen, Eichhörnchen
  deco(t);
  // Zielscheibe
  if(task)target(xs(task.r),G,t);
  stuck.forEach(a=>{arrowAt(a.x+(a.hit?Math.sin(t*30)*wob*3:0),a.y,a.ang,a.hit);
    ctx.font='700 30px Schul,system-ui';ctx.textAlign='center';ctx.textBaseline='top';ctx.lineWidth=5;ctx.strokeStyle='#fff';ctx.fillStyle=a.hit?'#3F9560':'#E5534B';
    ctx.strokeText(a.v,a.x,G+8);ctx.fillText(a.v,a.x,G+8)});
  knight(t);
  if(arrow){const q=Math.min(1,(now-arrow.t)/arrow.dur),sx=x0()+22,sy=G-50,ex=xs(arrow.v),ey=arrow.ey,peak=Math.max(30,(ex-sx)*.35);
    const pos=k=>[sx+(ex-sx)*k,sy+(ey-sy)*k-peak*4*k*(1-k)];
    for(let k=1;k<=6;k++){const qq=Math.max(0,q-k*.025),[x,y]=pos(qq);ctx.fillStyle=`rgba(255,255,255,${.5-k*.07})`;ctx.beginPath();ctx.arc(x,y,3-k*.3,0,7);ctx.fill()}
    const [x,y]=pos(q);arrowAt(x,y,Math.atan2((ey-sy)-peak*4*(1-2*q),ex-sx),false)}
  // Funken bei Treffer
  sparks=sparks.filter(p=>now-p.t<900);sparks.forEach(p=>{const q=(now-p.t)/900;ctx.globalAlpha=1-q;ctx.fillStyle=p.c;
    star(p.x+p.vx*q*60,p.y+p.vy*q*60+q*q*40,6*(1-q*.5));ctx.globalAlpha=1});
  wob*=.94;
}
function star(x,y,r){ctx.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*.45:r;ctx.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr)}ctx.fill()}
function pine(x,base,h,c1,c2){ctx.fillStyle='#6B4A2E';ctx.fillRect(x-h*.04,base-h*.25,h*.08,h*.25);
  for(let k=0;k<3;k++){const y=base-h*.2-k*h*.24,w=h*(.36-k*.08);ctx.fillStyle=k%2?c2:c1;ctx.beginPath();ctx.moveTo(x-w,y);ctx.lineTo(x+w,y);ctx.lineTo(x,y-h*.38);ctx.fill()}}
function leafy(x,base,h,c1,c2){ctx.fillStyle='#7A5233';ctx.fillRect(x-h*.05,base-h*.45,h*.1,h*.45);
  [[0,-.62,.3,c1],[-.2,-.5,.22,c2],[.2,-.52,.22,c2],[0,-.8,.22,c1]].forEach(([dx,dy,r,c])=>{ctx.fillStyle=c;ctx.beginPath();ctx.arc(x+dx*h,base+dy*h,r*h,0,7);ctx.fill()})}
const TREES=Array.from({length:14},(_,i)=>({f:i/13+(Math.random()-.5)*.05,h:.7+Math.random()*.5,pine:Math.random()<.55}));
function forest(base,c1,c2,sc,row){TREES.forEach((tr,i)=>{if(i%2!==row-1)return;const x=tr.f*W,h=Math.min(W,H)*.32*sc*tr.h;
  (tr.pine?pine:leafy)(x,base,h,c1,c2)})}
const DECO=[[.2,'🍄',.9],[.47,'🌼',.7],[.63,'🍄',.7],[.86,'🌷',.8],[.35,'🌿',.8]];
function deco(t){const G=gy();ctx.textAlign='center';ctx.textBaseline='bottom';
  DECO.forEach(([f,e,sc])=>{ctx.font=`${Math.round(22*sc)}px system-ui`;ctx.fillText(e,W*f,G+2)});
  ctx.font='26px system-ui';ctx.fillText('🐿️',W*.95,G*.74-Math.abs(Math.sin(t*2))*3);
  const bx=W*.5+Math.sin(t*.7)*W*.3,by=G*.35+Math.sin(t*2.3)*20;ctx.font='18px system-ui';ctx.fillText('🦋',bx,by)}
function target(x,G,t){const h=Math.min(46,H*.2),cy=G-h*1.05,dx=Math.sin(t*30)*wob*3;
  ctx.strokeStyle='#8B5A2B';ctx.lineWidth=5;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(x-h*.35,G);ctx.lineTo(x+dx,cy-h*.2);ctx.lineTo(x+h*.35,G);ctx.moveTo(x+dx,cy);ctx.lineTo(x+h*.1,G);ctx.stroke();
  ctx.fillStyle='#E9C46A';ctx.beginPath();ctx.ellipse(x+dx,cy,h*.36,h*1.02,0,0,7);ctx.fill();
  [['#fff',.88],['#E5534B',.7],['#fff',.52],['#E5534B',.34],['#FFD23F',.17]].forEach(([c,f])=>{ctx.fillStyle=c;ctx.beginPath();ctx.ellipse(x+dx,cy,h*.3*f/.88,h*f,0,0,7);ctx.fill()})}
function knight(t){const x=x0(),y=gy(),p=pow/MAXV,br=Math.sin(t*2)*1;
  // Beine
  ctx.strokeStyle='#6B4A2E';ctx.lineWidth=7;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x-6,y);ctx.lineTo(x-2,y-30);ctx.lineTo(x+7,y);ctx.stroke();
  // Köcher mit Pfeilen
  ctx.save();ctx.translate(x-12,y-58+br);ctx.rotate(-.35);ctx.fillStyle='#8B5A2B';ctx.fillRect(-5,-4,10,30);
  ['#E5534B','#FFD23F','#2E7CC4'].forEach((c,k)=>{ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(-4+k*4,-4);ctx.lineTo(-6+k*4,-12);ctx.lineTo(-2+k*4,-12);ctx.fill()});ctx.restore();
  // Waffenrock
  ctx.fillStyle='#3F7A47';ctx.beginPath();ctx.moveTo(x-11,y-58+br);ctx.lineTo(x+11,y-58+br);ctx.lineTo(x+13,y-28);ctx.lineTo(x-13,y-28);ctx.fill();
  ctx.fillStyle='#6B4A2E';ctx.fillRect(x-12,y-40+br,24,4);ctx.fillStyle='#E0A800';ctx.fillRect(x-3,y-41+br,6,6);
  // Kopf mit grünem Hut und Feder
  const hy=y-68+br;ctx.fillStyle='#F6CBA0';ctx.beginPath();ctx.arc(x,hy,10,0,7);ctx.fill();
  ctx.fillStyle='#222';ctx.beginPath();ctx.arc(x+4,hy-1,1.6,0,7);ctx.fill();
  ctx.strokeStyle='#222';ctx.lineWidth=1.3;ctx.beginPath();ctx.arc(x+3,hy+3,3,.2,1.4);ctx.stroke();
  ctx.fillStyle='#3F7A47';ctx.beginPath();ctx.moveTo(x-13,hy-5);ctx.lineTo(x+14,hy-5);ctx.lineTo(x+4,hy-19);ctx.quadraticCurveTo(x-6,hy-16,x-13,hy-5);ctx.fill();
  ctx.fillStyle='#2F6338';ctx.fillRect(x-13,hy-7,27,3);
  ctx.strokeStyle='#E5534B';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x-6,hy-9);ctx.quadraticCurveTo(x-16,hy-24+Math.sin(t*3)*2,x-24,hy-26);ctx.stroke();
  // Bogen spannt sich mit pow
  const bx=x+24,by=y-50,R=30,pull=6+p*22;
  ctx.strokeStyle='#6B3E1E';ctx.lineWidth=5;ctx.beginPath();ctx.arc(bx-R*.4,by,R,-1.1,1.1);ctx.stroke();
  ctx.fillStyle='#FFD23F';ctx.beginPath();ctx.arc(bx-R*.4+R*Math.cos(0),by,3,0,7);ctx.fill();
  const tx=bx-R*.4+R*Math.cos(1.1),ty1=by-R*Math.sin(1.1),ty2=by+R*Math.sin(1.1);
  ctx.strokeStyle='#EEE';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(tx,ty1);ctx.lineTo(tx-pull,by);ctx.lineTo(tx,ty2);ctx.stroke();
  ctx.strokeStyle='#F6CBA0';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(x+6,y-52+br);ctx.lineTo(tx-pull,by);ctx.stroke();
  if(!arrow&&ready)arrowAt(tx-pull+26,by,0,false);
}
function arrowAt(x,y,ang,hit){ctx.save();ctx.translate(x,y);ctx.rotate(ang);
  ctx.strokeStyle='#6B3E1E';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-26,0);ctx.lineTo(4,0);ctx.stroke();
  ctx.fillStyle='#8C96A1';ctx.beginPath();ctx.moveTo(10,0);ctx.lineTo(1,-5);ctx.lineTo(1,5);ctx.fill();
  ctx.fillStyle=hit?'#FFD23F':'#fff';[-1,1].forEach(sg=>{ctx.beginPath();ctx.moveTo(-27,0);ctx.lineTo(-22,sg*7);ctx.lineTo(-15,sg*1);ctx.lineTo(-18,0);ctx.fill()});
  ctx.restore()}
function loop(now){if(!$('game').classList.contains('on'))return;
  if(holding){pow=Math.min(MAXV,(now-hStart)/FULL*MAXV);const n=Math.floor(pow);if(n!==lastTick){lastTick=n;tick(n)}setMeter()}
  draw(now);requestAnimationFrame(loop)}
function setMeter(){$('fill').style.height=(pow/MAXV*100)+'%';$('pow').style.bottom=`calc(14px + (100% - 28px) * ${pow/MAXV})`;$('pow').textContent=Math.round(pow)}

// ---------- Ablauf ----------
function newTask(){task=makeTask();tries=0;stuck=[];pow=0;setMeter();drawStrip();
  $('task').classList.remove('ok');$('task').innerHTML=`${task.a} ${task.op} ${task.b} = <span class="q">?</span>`;
  $('msg').textContent='Rechne aus, wie weit es ist!';say(spoken(task),400);
  ready=true;$('hold').classList.remove('wait')}
function down(e){e.preventDefault();audio();if(!ready||arrow)return;holding=true;hStart=performance.now();lastTick=-1;$('hold').classList.add('down');$('msg').textContent='Lass beim richtigen Wert los!'}
function up(e){e.preventDefault();if(!holding)return;holding=false;$('hold').classList.remove('down');shoot()}
$('hold').addEventListener('pointerdown',down);$('hold').addEventListener('pointerup',up);$('hold').addEventListener('pointercancel',up);$('hold').addEventListener('pointerleave',up);
function shoot(){
  const v=Math.round(pow);ready=false;$('hold').classList.add('wait');twang();
  const h0=Math.min(46,H*.2);arrow={v,t:performance.now(),dur:500+v*60,ey:v===task.r?gy()-h0*1.05:gy()-4};
  later(()=>{const hit=v===task.r,h=Math.min(46,H*.2);
    stuck.push({x:xs(v),y:hit?gy()-h*1.05:gy()-4,ang:hit?0:.5,hit,v});arrow=null;thud();
    if(hit){ok();wob=1;const n=performance.now(),cx=xs(v),cy=gy()-h*1.05;for(let k=0;k<14;k++){const a=k/14*Math.PI*2;sparks.push({x:cx,y:cy,vx:Math.cos(a)*(1+Math.random()),vy:Math.sin(a)*(1+Math.random())-1,t:n,c:['#FFD23F','#E5534B','#fff','#2E7CC4'][k%4]})}if(tries===0)firstTry++;solved++;res.push(tries===0?'⭐':'✔️');drawStrip();
      $('task').classList.add('ok');$('task').querySelector('.q').textContent=task.r;$('msg').textContent='Treffer! 🎯';
      say(`Treffer! ${spoken(task)} ist ${task.r}.`,200);later(next,2800);return}
    tries++;tone(220,.3,'sine',.25);
    const t=v<task.r?'Zu kurz!':'Zu weit!';
    if(tries<2){$('msg').textContent=`${t} Rechne nochmal.`;say(`${t} Rechne nochmal: ${spoken(task)}`,200);
      later(()=>{pow=0;setMeter();ready=true;$('hold').classList.remove('wait')},2200)}
    else{res.push('·');drawStrip();$('task').querySelector('.q').textContent=task.r;$('msg').textContent=`${t} Es ist ${task.r}.`;
      say(`${spoken(task)} ist ${task.r}.`,200);later(next,3200)}
  },arrow.dur);
}
function next(){r++;if(r<ROUNDS)newTask();else finish()}
function finish(){
  const st=firstTry>=8?3:solved>=6?2:1;show('end');
  $('endInfo').textContent=`Eltern: ${firstTry} von ${ROUNDS} beim ersten Schuss · ${solved} getroffen`;
  $('stars').querySelectorAll('span').forEach(x=>x.classList.remove('on'));
  $('stars').querySelectorAll('span').forEach((x,i)=>{if(i<st)later(()=>{x.classList.add('on');tone([523,659,784][i],.5,'sine',.3)},400+i*500)});
  later(()=>say(st===3?'Super! Du bist ein Meisterschütze!':st===2?'Toll geschossen! Rechne beim nächsten Mal ganz in Ruhe!':'Gut gemacht! Übung macht den Meister!'),1900);
}
function startGame(){audio();if('speechSynthesis' in window){const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u)}
  gid++;r=0;res=[];firstTry=0;solved=0;seen=new Set();arrow=null;show('game');resize();requestAnimationFrame(loop);
  say('Rechne aus, wie weit die Scheibe ist. Halte gedrückt und lass beim richtigen Wert los!');later(newTask,4200)}
$('go').addEventListener('click',startGame);
$('again').addEventListener('click',startGame);
$('homeBtn').addEventListener('click',()=>{gid++;holding=false;ready=false;if('speechSynthesis' in window)speechSynthesis.cancel();show('start')});
if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js');
document.addEventListener('gesturestart',e=>e.preventDefault());
</script>
