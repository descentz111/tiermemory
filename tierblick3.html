<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Buchstaben-Blick">
<title>Buchstaben-Blick</title>
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  :root{--bg:#FFF6E5;--ink:#3B2F2A;--card:300px}
  @font-face{font-family:Schul;src:url(schulschrift.woff2) format('woff2');font-weight:700;font-display:swap}
  .sym.let,.lb,#pLet,#pLet i,#pWord,#endTitle{font-family:Schul,-apple-system,system-ui,sans-serif!important;font-weight:700}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;touch-action:manipulation;
    font-family:-apple-system,"SF Pro Rounded","Arial Rounded MT Bold",system-ui,sans-serif}
  .screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;
    padding:calc(env(safe-area-inset-top) + 10px) 10px calc(env(safe-area-inset-bottom) + 12px)}
  .screen.on{display:flex}
  .btn{border:0;border-radius:22px;padding:18px 34px;font:inherit;font-size:24px;font-weight:800;color:#fff;background:#9B6BFF;box-shadow:0 5px 0 #6E45C9}
  .btn:active{transform:translateY(4px);box-shadow:0 1px 0 #6E45C9}
  #start,#end{justify-content:center;gap:18px;text-align:center}
  h1{font-size:42px;margin:0} h2{font-size:32px;margin:0}
  p{margin:0;font-size:20px;font-weight:700}
  .big{font-size:80px;line-height:1}
  header{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .pill{background:#fff;border-radius:16px;padding:8px 12px;font-size:18px;font-weight:800;box-shadow:0 2px 0 #EBDCC2}
  .home{border:0;background:#fff;border-radius:16px;width:46px;height:42px;font-size:22px;box-shadow:0 2px 0 #EBDCC2}
  #area{flex:1;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly}
  .card{position:relative;width:var(--card);height:var(--card);border-radius:50%;background:#fff;
    box-shadow:0 6px 0 #E3D3B8,0 0 0 6px #fff inset;border:4px solid #F0E3CC;transition:transform .35s}
  .card.in{animation:cardIn .4s}
  @keyframes cardIn{from{transform:scale(.4) rotate(-60deg);opacity:0}to{transform:none;opacity:1}}
  .sym{position:absolute;display:flex;align-items:center;justify-content:center;line-height:1;cursor:pointer;transition:transform .2s}
  .sym.hit{animation:hit .9s;z-index:3}
  @keyframes hit{0%,100%{transform:var(--t) scale(1)}40%{transform:var(--t) scale(1.6)}}
  .sym.ring::after{content:'';position:absolute;inset:-8%;border:5px solid #5BB87A;border-radius:50%}
  .sym.maxring::after{content:'';position:absolute;inset:-8%;border:5px solid #E5534B;border-radius:50%}
  .sym.shake{animation:shake .35s}
  @keyframes shake{25%{transform:var(--t) translateX(6px)}75%{transform:var(--t) translateX(-6px)}}
  .sym.hint{animation:hint .6s 3}
  @keyframes hint{50%{transform:var(--t) scale(1.3)}}
  #maxRow{display:flex;align-items:center;gap:10px;width:min(90%,420px)}
  #maxFace{font-size:40px;transition:transform .2s}
  #maxFace.yay{animation:hit .8s}
  #bar{flex:1;height:16px;background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 2px 0 #EBDCC2}
  #barIn{height:100%;width:0;background:linear-gradient(90deg,#FFD23F,#E5534B);border-radius:10px}
  #pop{position:fixed;inset:0;background:rgba(59,47,42,.35);display:none;align-items:center;justify-content:center;z-index:20}
  #pop.on{display:flex}
  .pbox{background:#fff;border-radius:32px;padding:20px 26px 24px;text-align:center;min-width:min(86vw,340px)}
  .prow{display:flex;align-items:center;justify-content:center;gap:18px}
  #pEmo{font-size:110px;line-height:1;width:120px;height:120px;display:flex;align-items:center;justify-content:center;visibility:hidden}
  #pLet{font-size:120px;font-weight:900;line-height:1;color:#FF8A3D;opacity:0;transform:scale(.3);transition:all .4s cubic-bezier(.3,1.5,.5,1)}
  #pLet i{font-style:normal}
  #pLet.show{opacity:1;transform:none}
  #pWord{font-size:40px;font-weight:800;margin-top:8px;opacity:0;transition:opacity .3s}
  #pWord.show{opacity:1}
  #pWord b{color:#FF8A3D}
  .fly{position:fixed;z-index:30;line-height:1;display:flex;align-items:center;justify-content:center;pointer-events:none;
    transition:left .6s ease,top .6s ease,width .6s ease,height .6s ease,font-size .6s ease,transform .6s ease}
  #letters{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:420px}
  .lb{position:relative;border:0;border-radius:16px;background:#fff;box-shadow:0 4px 0 #E3D3B8;font:inherit;font-size:24px;font-weight:900;padding:8px 12px;color:var(--ink)}
  .lb.new{background:#FFE7A8}
  .lb.new::after{content:'neu';position:absolute;top:-10px;right:-8px;background:#E5534B;color:#fff;font-size:11px;padding:2px 6px;border-radius:8px}
  .sym.let{font-weight:900;color:var(--lc);font-family:-apple-system,"SF Pro Rounded",system-ui,sans-serif;letter-spacing:.02em}
  .gk{color:#E5534B}
  .gk i,i.kl{font-style:normal;font-size:.78em;color:#2E7CC4;margin-left:.04em}
  #strip{display:flex;gap:3px;background:#fff;border-radius:16px;padding:6px 8px;box-shadow:0 2px 0 #EBDCC2}
  #strip span{width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:17px;border-radius:50%;background:#F3E9D8}
  #strip span.cur{box-shadow:0 0 0 3px #FFD23F}
  .sym.off{opacity:.25;filter:grayscale(1);pointer-events:none}
  .card.locked{pointer-events:none}
  #stars{display:flex;gap:10px;font-size:76px}
  #stars span{opacity:.18;filter:grayscale(1);transform:scale(.6);transition:all .45s cubic-bezier(.3,1.6,.5,1)}
  #stars span.on{opacity:1;filter:none;transform:scale(1)}
  #gift{position:relative;font-size:120px;line-height:1;margin-top:10px}
  #gift.wob{animation:wob 1s infinite}
  @keyframes wob{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
  #lock{position:absolute;right:-14px;bottom:-6px;font-size:52px}
  #giftOpen{display:none;flex-direction:column;align-items:center;font-family:Schul,-apple-system,system-ui,sans-serif;font-weight:700}
  #giftOpen.on{display:flex;animation:cardIn .5s}
  #giftOpen .gl{font-size:130px;line-height:1.1}
  #giftOpen .ge{font-size:90px;line-height:1.1}
  #again{border:0;width:110px;height:110px;border-radius:50%;background:#5BB87A;color:#fff;font-size:54px;box-shadow:0 6px 0 #3F9560;padding-left:10px}
  #again:active{transform:translateY(4px);box-shadow:0 2px 0 #3F9560}
  #endInfo{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 8px);font-size:12px;color:#9A8F85}
  #intro{justify-content:center;gap:10px;text-align:center}
  #inLet{font-family:Schul,-apple-system,system-ui,sans-serif;font-weight:700;font-size:150px;line-height:1.1;color:#FF8A3D}
  #inEmo{font-size:110px;line-height:1.1}
  #inWord{font-family:Schul,-apple-system,system-ui,sans-serif;font-weight:700;font-size:48px}
  #inWord b{color:#FF8A3D}
  .inAnim{animation:cardIn .4s}
  #msg{font-size:22px;font-weight:800;min-height:30px;text-align:center}
</style>
</head>
<body>

<section id="start" class="screen on">
  <div class="big">🔤🐴</div>
  <h1>Buchstaben-Blick</h1>
  <p>Welches Tier fängt mit einem<br>Buchstaben von oben an?</p>
  <div id="letters"></div>
  <div id="progress" style="font-size:16px;font-weight:700;opacity:.75"></div>
  <button class="btn" id="go">Los geht's!</button>
</section>

<section id="intro" class="screen">
  <p id="inTitle"></p>
  <div id="inLet"></div>
  <div id="inEmo"></div>
  <div id="inWord"></div>
  <p style="opacity:.55;font-size:16px">Tippen zum Überspringen</p>
</section>

<section id="game" class="screen">
  <header>
    <button class="home" id="homeBtn">🏠</button>
    <div id="strip"></div>
    <div style="width:46px"></div>
  </header>
  <div id="area">
    <div class="card" id="cardA"></div>
    <div id="msg"></div>
    <div id="maxRow"><div id="maxFace">🐴</div><div id="bar"><div id="barIn"></div></div></div>
    <div class="card" id="cardB"></div>
  </div>
</section>

<section id="end" class="screen">
  <div id="stars"><span>⭐</span><span>⭐</span><span>⭐</span></div>
  <div id="gift">🎁<b id="lock">🔒</b></div>
  <div id="giftOpen"></div>
  <button id="again" aria-label="Nochmal">▶</button>
  <div id="endInfo"></div>
</section>

<div id="pop"><div class="pbox"><div class="prow"><div id="pEmo"></div><div id="pLet"></div></div><div id="pWord"></div></div></div>
<script>
const $=id=>document.getElementById(id);
const rand=n=>Math.floor(Math.random()*n);
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=rand(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id))}

// ---------- Sprache & Töne ----------
let voice=null;
function pickVoice(){const v=speechSynthesis.getVoices().filter(x=>x.lang&&x.lang.toLowerCase().startsWith('de'));
  voice=v.find(x=>/Anna|Helena|Petra|Marlene/i.test(x.name))||v[0]||null}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
let sayT=null;
function say(t,delay=300){if(!('speechSynthesis' in window))return;speechSynthesis.cancel();clearTimeout(sayT);
  const u=new SpeechSynthesisUtterance(t);u.lang='de-DE';if(voice)u.voice=voice;u.rate=.9;u.pitch=1.1;window._u=u;
  sayT=setTimeout(()=>speechSynthesis.speak(u),delay)}
const SPOKEN={A:'a',B:'bö',C:'kö',D:'dö',E:'e',F:'fh',G:'gö',H:'hö',I:'i',J:'jö',K:'kö',L:'lh',M:'mh',N:'nh',O:'o',
  P:'pö',R:'rh',S:'ssh',T:'tö',U:'u',W:'wh',Z:'tsö'};
let seqT=null;
function sayLetterThenName(name){if(!('speechSynthesis' in window))return;speechSynthesis.cancel();clearTimeout(sayT);clearTimeout(seqT);
  const mk=t=>{const u=new SpeechSynthesisUtterance(t);u.lang='de-DE';if(voice)u.voice=voice;u.rate=.85;u.pitch=1.1;return u};
  const L=name[0].toUpperCase(),u1=mk(SPOKEN[L]||L);window._u=u1;let done=false;
  const next=()=>{if(done)return;done=true;seqT=setTimeout(()=>{const u2=mk(name);window._u2=u2;speechSynthesis.speak(u2)},700)};
  u1.onend=next;seqT=setTimeout(()=>{speechSynthesis.speak(u1);setTimeout(next,2500)},250)}
const disp=l=>l;
const pair=l=>`<span class="gk">${l}<i>${l.toLowerCase()}</i></span>`; // groß rot, klein blau und etwas kleiner
const sch=t=>String(t); // Schul-a (einstöckig)
let ac=null;
function audio(){if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(ac&&ac.state==='suspended')ac.resume()}
function tone(f1,f2,dur,type='sine',vol=.3,delay=0){if(!ac)return;const t=ac.currentTime+delay,o=ac.createOscillator(),g=ac.createGain();
  o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+dur)}
const ding=()=>{tone(880,880,.15,'sine',.3);tone(1320,1320,.25,'sine',.25,.1)};
const bonk=()=>tone(180,70,.2,'triangle',.45);
const jubel=()=>[523,659,784,1047].forEach((f,i)=>tone(f,f,.25,'sine',.3,i*.12));
function neigh(){if(!ac)return;const t=ac.currentTime,o=ac.createOscillator(),l=ac.createOscillator(),lg=ac.createGain(),g=ac.createGain();
  o.type='sawtooth';o.frequency.setValueAtTime(700,t);o.frequency.linearRampToValueAtTime(950,t+.25);o.frequency.linearRampToValueAtTime(500,t+1);
  l.frequency.value=14;lg.gain.value=60;l.connect(lg).connect(o.frequency);
  g.gain.setValueAtTime(.001,t);g.gain.linearRampToValueAtTime(.16,t+.05);g.gain.linearRampToValueAtTime(.001,t+1);
  o.connect(g).connect(ac.destination);o.start(t);l.start(t);o.stop(t+1);l.stop(t+1)}

// ---------- Tiere ----------
// Buchstaben in Fibel-Reihenfolge und Tiere je Anlaut
const ORDER=['M','A','L','I','O','S','E','R','T','N','U','H','F','W','D','K','B','P','G','Z'];
const ANIM={M:[['🐭','Maus'],['🐞','Marienkäfer']],A:[['🐵','Affe'],['🐜','Ameise'],['🦅','Adler']],L:[['🦁','Löwe'],['🦙','Lama'],['🐆','Leopard']],
 I:[['🦔','Igel']],O:[['🐙','Oktopus']],S:[['🦭','Seehund']],E:[['🐘','Elefant'],['🦆','Ente']],
 R:[['🐛','Raupe']],T:[['🐯','Tiger'],['🕊️','Taube']],N:[['🦏','Nashorn'],['🦛','Nilpferd']],U:[['🦉','Uhu']],
 H:[['🐰','Hase'],['🐶','Hund'],['🐔','Huhn'],['🦈','Hai']],F:[['🦊','Fuchs'],['🐸','Frosch'],['🦇','Fledermaus'],['🦩','Flamingo']],
 W:[['🐳','Wal'],['🐺','Wolf']],D:[['🐬','Delfin'],['🦕','Dino']],K:[['🐱','Katze'],['🐮','Kuh'],['🐨','Koala'],['🐊','Krokodil'],['🐫','Kamel'],['🦘','Känguru']],
 B:[['🐻','Bär'],['🐝','Biene']],P:[['🐼','Panda'],['🐧','Pinguin'],['🦜','Papagei']],G:[['🦒','Giraffe'],['🦍','Gorilla']],Z:[['🦓','Zebra'],['🐐','Ziege']]};
const LCOL=['#E5534B','#2E7CC4','#3F9560','#9B6BFF','#E0661E','#C2185B'];
// Fortschritt: neuer Buchstabe, wenn ein Durchgang gut lief (mind. 7 von 10 selbst gefunden, höchstens 4 Fehltipper)
function getN(){try{return Math.max(3,+localStorage.getItem('bbLetters')||3)}catch(e){return 3}}
function setN(n){try{localStorage.setItem('bbLetters',n)}catch(e){}}
let learned=[],errTotal=0,sharedL='',gid=0,res=[],starCards=0;
function drawStrip(){$('strip').innerHTML=Array.from({length:ROUNDS},(_,i)=>`<span class="${i===round&&res.length===i?'cur':''}">${res[i]||''}</span>`).join('')}
function later(fn,ms){const g=gid;setTimeout(()=>{if(g===gid)fn()},ms)}
const SPOTS={
 3:[[.5,.27],[.29,.66],[.71,.66]],
 4:[[.3,.3],[.7,.3],[.3,.7],[.7,.7]],
 6:[[.5,.5],[.5,.18],[.8,.4],[.69,.77],[.31,.77],[.2,.4]]
};
const ROUNDS=10;
const easy=()=>learned.length<=5;                       // Anfang: wenige Buchstaben -> leichte Karten
const perCard=r=>easy()?(r<3?2:r<6?3:4):(r<3?3:r<6?4:6);   // Tiere auf der unteren Karte
const perTop=(r,n)=>easy()?(r<3?1:r<6?2:3):n;              // Buchstaben auf der oberen Karte
const maxTime=n=>(easy()?{2:13000,3:13000,4:14000}[n]:{3:9000,4:11000,6:14000}[n])+rand(2500);   // so lange braucht Max (ms)

let round=0,me=0,mx=0,shared=null,resolved=true,t0=0,limit=0,wrong=0;

function makeCard(el,items){
  const n=items.length,C=el.clientWidth,spots=SPOTS[n],off=rand(360)*Math.PI/180;
  el.innerHTML='';el.classList.remove('in');void el.offsetWidth;el.classList.add('in');
  items.forEach((it,k)=>{
    let [x,y]=spots[k];const dx=x-.5,dy=y-.5;x=.5+dx*Math.cos(off)-dy*Math.sin(off);y=.5+dx*Math.sin(off)+dy*Math.cos(off);
    const base=n===3?.34:n===4?.3:.24,sz=C*base*(it.let?1:(.75+Math.random()*.45)),rot=it.let?rand(30)-15:rand(80)-40;
    const d=document.createElement('div');d.className='sym'+(it.let?' let':'');if(it.let)d.innerHTML=it.txt;else d.textContent=it.txt;d.dataset.k=it.key;
    d.style.cssText=`left:${x*C-sz/2}px;top:${y*C-sz/2}px;width:${sz}px;height:${sz}px;font-size:${sz*(it.let?.5:.85)}px;--t:rotate(${rot}deg);transform:rotate(${rot}deg);--lc:${LCOL[rand(LCOL.length)]}`;
    d.addEventListener('click',()=>tap(it,d));el.appendChild(d)});
}
const SPOTS1={1:[[.5,.5]],2:[[.3,.5],[.7,.5]],5:[[.5,.5],[.5,.2],[.8,.45],[.65,.78],[.3,.62]]};
Object.assign(SPOTS,SPOTS1);
function newRound(){
  const n=perCard(round),nl=Math.min(perTop(round,n),learned.length),newest=learned[learned.length-1];
  sharedL=(learned.length>3&&Math.random()<.4)?newest:learned[rand(learned.length)];
  const top=[sharedL,...shuffle(learned.filter(l=>l!==sharedL)).slice(0,nl-1)];
  const al=ANIM[sharedL];shared=al[rand(al.length)];
  const pool=shuffle(Object.keys(ANIM).filter(l=>!top.includes(l)).flatMap(l=>ANIM[l]));
  const animals=shuffle([shared,...pool.slice(0,n-1)]);
  const size=Math.floor(Math.min(innerWidth-40,(innerHeight-230)/2,380));
  document.documentElement.style.setProperty('--card',size+'px');
  requestAnimationFrame(()=>{
    makeCard($('cardA'),shuffle(top).map(l=>({txt:pair(l),key:'L:'+l,let:1})));
    makeCard($('cardB'),animals.map(a=>({txt:a[0],key:'A:'+a[0]})))});
  drawStrip();
  $('msg').textContent=round===0?'Welches Tier passt zu einem Buchstaben?':'';
  if(nl===1&&round>0)say(SPOKEN[sharedL]||sharedL,500);   // ein Buchstabe: Laut vorsprechen
  if(round===0)say(nl===1?`Oben ist ein Buchstabe. Welches Tier fängt mit ${SPOKEN[sharedL]||sharedL} an?`:'Oben sind Buchstaben, unten Tiere. Welches Tier fängt mit einem Buchstaben von oben an?');
  wrong=0;resolved=false;limit=maxTime(n);t0=performance.now()+(round===0?7000:0);$('barIn').style.width='0';
  requestAnimationFrame(tick);
}
function tick(now){if(resolved)return;
  const p=Math.max(0,Math.min(1,(now-t0)/limit));$('barIn').style.width=(p*100)+'%';
  if(p>=1){maxWins();return}requestAnimationFrame(tick)}

function reveal(){
  const a=shared,L=a[1][0],src=document.querySelector(`#cardB .sym[data-k="A:${a[0]}"]`);
  $('pEmo').textContent=a[0];$('pEmo').style.visibility='hidden';
  $('pLet').innerHTML=pair(L);$('pLet').classList.remove('show');
  $('pWord').innerHTML=`<b>${disp(L)}</b>${sch(a[1].slice(1))}`;$('pWord').classList.remove('show');
  $('pop').classList.add('on');
  const r=src.getBoundingClientRect(),t=$('pEmo').getBoundingClientRect(),f=document.createElement('div');
  f.className='fly';f.textContent=a[0];
  f.style.cssText=`left:${r.left}px;top:${r.top}px;width:${r.width}px;height:${r.height}px;font-size:${r.height*.85}px;transform:${getComputedStyle(src).transform}`;
  document.body.appendChild(f);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{f.style.left=t.left+'px';f.style.top=t.top+'px';f.style.width=t.width+'px';f.style.height=t.height+'px';f.style.fontSize='110px';f.style.transform='none'}));
  later(()=>{f.remove();$('pEmo').style.visibility='visible';$('pLet').classList.add('show');sayLetterThenName(a[1])},650);
  later(()=>$('pWord').classList.add('show'),1400);
  setTimeout(()=>f.remove(),800);
}
function closePop(){$('pop').classList.remove('on')}
function mark(cls){document.querySelectorAll(`.sym[data-k="A:${shared[0]}"],.sym[data-k="L:${sharedL}"]`).forEach(s=>s.classList.add(cls,'hit'))}
function tap(it,el){
  if(resolved)return;audio();
  if(it.key!=='A:'+shared[0]&&it.key!=='L:'+sharedL){bonk();el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake');wrong++;errTotal++;
    later(()=>el.classList.add('off'),350);['cardA','cardB'].forEach(c=>$(c).classList.add('locked'));later(()=>['cardA','cardB'].forEach(c=>$(c).classList.remove('locked')),1500);
    if(wrong===2){$('msg').textContent='Hör mal …';say('Welches Tier fängt mit '+(SPOKEN[sharedL]||sharedL)+' an?',100);
      document.querySelector(`#cardA .sym[data-k="L:${sharedL}"]`).classList.add('hint')}
    return}
  resolved=true;me++;if(wrong===0)starCards++;res.push(wrong===0?'⭐':'✔️');drawStrip();ding();mark('ring');$('msg').textContent='Super! 🎉';
  later(reveal,900);later(next,4400)}
function maxWins(){
  resolved=true;mx++;res.push('🐴');drawStrip();neigh();mark('maxring');$('maxFace').classList.remove('yay');void $('maxFace').offsetWidth;$('maxFace').classList.add('yay');
  $('msg').textContent='Max war schneller!';say('Max war schneller!',200);
  later(reveal,900);later(next,4400)}
function next(){closePop();['cardA','cardB'].forEach(c=>$(c).classList.remove('locked'));round++;if(round<ROUNDS)newRound();else finish()}
function finish(){
  const n3=starCards>=8,stars=n3?3:(starCards>=4||me>=7)?2:1,before=getN(),canNew=n3&&before<ORDER.length;
  show('end');$('giftOpen').classList.remove('on');$('gift').style.display='';
  $('stars').querySelectorAll('span').forEach(x=>x.classList.remove('on'));
  $('lock').style.display=canNew?'none':'';$('gift').classList.toggle('wob',canNew);
  $('endInfo').textContent=`Eltern: ${starCards}× beim ersten Tipp · ${me} gefunden · Max ${mx} · Fehltipper ${errTotal}`;
  $('stars').querySelectorAll('span').forEach((x,i)=>{if(i<stars)later(()=>{x.classList.add('on');tone(660+i*220,660+i*220,.2,'sine',.3)},500+i*600)});
  later(()=>{jubel();
    say(canNew?'Drei Sterne! Super! Tippe auf das Geschenk!':
        stars===3?'Drei Sterne! Du kennst schon alle Buchstaben!':
        stars===2?'Zwei Sterne! Toll! Schau genau und tippe ruhig. Dann gibt es drei Sterne und ein Geschenk.':
                  'Ein Stern! Gut gemacht! Schau genau und tippe ruhig. Dann gibt es mehr Sterne.')},500+stars*600);
  $('gift').onclick=()=>{audio();
    if(!canNew){bonk();say('Mit drei Sternen geht das Geschenk auf.');return}
    if(getN()!==before)return;setN(before+1);const L=ORDER[before],a=ANIM[L][0];
    $('gift').style.display='none';$('giftOpen').innerHTML=`<div class="gl">${pair(L)}</div><div class="ge">${a[0]}</div>`;
    $('giftOpen').classList.add('on');jubel();later(()=>sayLetterThenName(a[1]),600)};
}
function showStart(){
  const n=getN();learned=ORDER.slice(0,n);
  $('letters').innerHTML=learned.map((l,i)=>`<button class="lb${i===n-1&&n>3?' new':''}" data-l="${l}">${pair(l)}</button>`).join('');
  $('letters').querySelectorAll('.lb').forEach(b=>b.addEventListener('click',()=>{audio();const l=b.dataset.l,a=ANIM[l][0];sayLetterThenName(a[1])}));
  $('progress').textContent=`Du kennst ${n} von ${ORDER.length} Buchstaben`;show('start');
}
// ---------- Einleitung: neue Buchstaben kurz vorstellen (Tippen überspringt) ----------
function getIntro(){try{return +localStorage.getItem('bbIntro')||0}catch(e){return 0}}
function startGame(){audio();if('speechSynthesis' in window){const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u)}
  const n=getN(),fresh=ORDER.slice(Math.min(getIntro(),n),n);
  if(!fresh.length){beginGame();return}
  gid++;show('intro');$('inTitle').textContent=fresh.length>1?'Deine Buchstaben':'Dein neuer Buchstabe';
  const step=i=>{
    if(i>=fresh.length){endIntro();return}
    const l=fresh[i],a=ANIM[l][0];
    $('inLet').innerHTML=pair(l);$('inEmo').textContent=a[0];$('inWord').innerHTML=`<b>${l}</b>${a[1].slice(1)}`;
    ['inLet','inEmo','inWord'].forEach(id=>{const e=$(id);e.classList.remove('inAnim');void e.offsetWidth;e.classList.add('inAnim')});
    sayLetterThenName(a[1]);later(()=>step(i+1),3600)};
  step(0);
}
function endIntro(){try{localStorage.setItem('bbIntro',getN())}catch(e){}
  clearTimeout(seqT);if('speechSynthesis' in window)speechSynthesis.cancel();beginGame()}
$('intro').addEventListener('click',endIntro);
function beginGame(){
  gid++;learned=ORDER.slice(0,getN());errTotal=0;res=[];starCards=0;round=0;me=0;mx=0;show('game');newRound()}
$('go').addEventListener('click',startGame);
$('again').addEventListener('click',showStart);
$('homeBtn').addEventListener('click',()=>{gid++;clearTimeout(seqT);resolved=true;closePop();if('speechSynthesis' in window)speechSynthesis.cancel();showStart()});
if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js');
showStart();
document.addEventListener('gesturestart',e=>e.preventDefault());
</script>
</body>
