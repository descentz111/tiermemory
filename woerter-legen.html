<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Wörter legen">
<title>Wörter legen</title>
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  :root{--bg:#FFF6E5;--ink:#3B2F2A;--accent:#FF8A3D;--green:#5BB87A;--blue:#4F8EDC;--red:#E5534B;--t:56px}
  @font-face{font-family:Schul;src:url(schulschrift.woff2) format('woff2');font-weight:700;font-display:swap}
  .slot,.tile{font-family:Schul,-apple-system,system-ui,sans-serif!important;font-weight:700}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;touch-action:manipulation;
    font-family:-apple-system,"SF Pro Rounded","Arial Rounded MT Bold",system-ui,sans-serif}
  .screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;
    padding:calc(env(safe-area-inset-top) + 12px) 12px calc(env(safe-area-inset-bottom) + 16px)}
  .screen.on{display:flex}
  .btn{border:0;border-radius:22px;padding:18px 30px;font:inherit;font-size:24px;font-weight:800;color:#fff;
    background:var(--green);box-shadow:0 5px 0 #3F9560}
  .btn:active{transform:translateY(4px);box-shadow:0 1px 0 #3F9560}

  #start{justify-content:center;gap:24px;text-align:center}
  #start h1{font-size:42px;margin:0}
  .hero{display:flex;gap:6px}.hero svg{width:72px;height:72px}

  #game header{width:100%;display:flex;justify-content:space-between;align-items:center}
  .pill{background:#fff;border-radius:16px;padding:8px 14px;font-size:18px;font-weight:800;box-shadow:0 2px 0 #EBDCC2}
  .home{border:0;background:#fff;border-radius:16px;width:46px;height:42px;font-size:22px;box-shadow:0 2px 0 #EBDCC2}
  #pic{width:min(46vw,200px);height:min(46vw,200px);margin:14px 0 6px;background:#fff;border-radius:30px;
    box-shadow:0 4px 0 #E3D3B8;display:flex;align-items:center;justify-content:center}
  #pic svg{width:86%;height:86%}
  #pic.yay{animation:yay .6s}
  @keyframes yay{30%{transform:scale(1.12) rotate(-4deg)}60%{transform:scale(1.05) rotate(4deg)}}

  .row{display:flex;gap:6px;justify-content:center;flex-wrap:nowrap;margin:14px 0}
  .slot,.tile{width:var(--t);height:calc(var(--t)*1.15);border-radius:14px;display:flex;align-items:center;justify-content:center;
    font-size:calc(var(--t)*.62);font-weight:900}
  .slot{background:#fff;border:3px dashed #D9C6A6;color:var(--ink)}
  .slot.full{border-style:solid;border-color:var(--blue)}
  .slot.ok{border-color:var(--green);background:#E9F7EE;color:#2E7D4F}
  .slot.bad{border-color:var(--red);background:#FDECEA;animation:shake .4s}
  .slot.show{border:3px solid var(--accent);color:var(--accent)}
  .tile{background:var(--blue);color:#fff;box-shadow:0 5px 0 #2C5E9E;transition:transform .5s cubic-bezier(.3,1.4,.5,1),opacity .2s}
  .tile:active{transform:translateY(3px)}
  .tile.gone{opacity:0;pointer-events:none}
  #tray{min-height:calc(var(--t)*1.3);flex-wrap:wrap;max-width:100%}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(6px)}75%{transform:translateX(-6px)}}
  .flyout{animation:fly .7s ease-in-out}
  @keyframes fly{0%{transform:none}30%{transform:translateY(-14px) rotate(-12deg)}60%{transform:translateY(8px) rotate(14deg)}100%{transform:none}}
  #msg{font-size:22px;font-weight:800;min-height:30px;color:var(--accent)}

  #end{justify-content:center;gap:14px;text-align:center}
  #end h2{font-size:34px;margin:0}
  #end p{margin:0;font-size:18px;font-weight:700}
  #podium{display:flex;align-items:flex-end;gap:6px}
  .step{width:84px;display:flex;flex-direction:column;align-items:center;opacity:.45}
  .step .who{font-size:34px;visibility:hidden}
  .step .blk{width:100%;border-radius:10px 10px 0 0;color:#fff;font-size:30px;font-weight:900;display:flex;justify-content:center;padding-top:6px}
  .step[data-p="1"] .blk{height:96px;background:#F4B400}
  .step[data-p="2"] .blk{height:70px;background:#A7B1BC}
  .step[data-p="3"] .blk{height:50px;background:#CD7F32}
  .step small{font-size:12px;font-weight:700;margin-top:3px}
  .step.me{opacity:1}.step.me .who{visibility:visible}
  #placeTxt{font-size:30px;font-weight:900;color:var(--accent)}
</style>
</head>
<body>
<section id="start" class="screen on">
  <div class="hero" id="hero"></div>
  <h1>Wörter legen</h1>
  <button class="btn" id="go">Los geht's!</button>
</section>

<section id="game" class="screen">
  <header>
    <button class="home" id="homeBtn">🏠</button>
    <div class="pill" id="round">Wort 1 / 5</div>
    <div class="pill" id="errs">Fehler: 0</div>
  </header>
  <div id="pic"></div>
  <div class="row" id="slots"></div>
  <div id="msg"></div>
  <div class="row" id="tray"></div>
</section>

<section id="end" class="screen">
  <h2>Super gemacht! 🎉</h2>
  <p id="endInfo"></p>
  <div id="podium">
    <div class="step" data-p="2"><div class="who">⭐</div><div class="blk">2</div><small>1–3 Fehler</small></div>
    <div class="step" data-p="1"><div class="who">⭐</div><div class="blk">1</div><small>0 Fehler</small></div>
    <div class="step" data-p="3"><div class="who">⭐</div><div class="blk">3</div><small>ab 4 Fehler</small></div>
  </div>
  <div id="placeTxt"></div>
  <button class="btn" id="again">Nochmal</button>
</section>

function spikes(cx,cy,rx,ry,n,len,a0,a1){let p=[];for(let i=0;i<=n*2;i++){const a=a0+(a1-a0)*i/(n*2);const k=i%2?1+len:1;p.push((cx+Math.cos(a)*rx*k).toFixed(1)+','+(cy+Math.sin(a)*ry*k).toFixed(1))}return p.join(' ')}
function mane(){let s='';for(let i=0;i<14;i++){const a=i/14*Math.PI*2;s+=`<circle cx="${(50+Math.cos(a)*30).toFixed(1)}" cy="${(52+Math.sin(a)*30).toFixed(1)}" r="11" fill="${i%2?'#D9661A':'#E8812A'}"/>`}return s}

const svgOf=a=>`<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">${a.svg}</svg>`;
const L=a=>a.n[0].toUpperCase();

// ---------- Sprache ----------
let voice=null;
function pickVoice(){const v=speechSynthesis.getVoices().filter(x=>x.lang&&x.lang.toLowerCase().startsWith('de'));
  voice=v.find(x=>/Anna|Helena|Petra|Marlene/i.test(x.name))||v[0]||null}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
let sayT=null;
function say(t,delay=0){if(!('speechSynthesis' in window))return;speechSynthesis.cancel();clearTimeout(sayT);
  const u=new SpeechSynthesisUtterance(t);u.lang='de-DE';if(voice)u.voice=voice;u.rate=.8;u.pitch=1.1;window._u=u;
  sayT=setTimeout(()=>speechSynthesis.speak(u),delay)}
function unlockSpeech(){if('speechSynthesis' in window){const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u)}}

// ---------- Spiel ----------
const $=id=>document.getElementById(id);
const ROUNDS=5;
let list=[],idx=0,errors=0,word='',filled=[],tiles=[],busy=false;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id))}

function startGame(){unlockSpeech();list=shuffle(ANIMALS.filter(a=>a.n.length<=6)).slice(0,ROUNDS);idx=0;errors=0;show('game');nextWord()}

function sizeTiles(n){
  const W=Math.min(innerWidth,600)-24, t=Math.floor(Math.min(64,(W-6*(n-1))/n));
  document.documentElement.style.setProperty('--t',t+'px');
}

function nextWord(){
  const a=list[idx];word=a.n.toUpperCase();busy=true;
  $('round').textContent=`Wort ${idx+1} / ${ROUNDS}`;$('errs').textContent=`Fehler: ${errors}`;
  $('pic').innerHTML=svgOf(a);$('msg').textContent='';
  sizeTiles(word.length);
  // 1) Wort zeigen
  $('slots').innerHTML=[...word].map(ch=>`<div class="slot show">${ch}</div>`).join('');
  $('tray').innerHTML='';
  say(a.n,500);
  // 2) schütteln
  setTimeout(()=>{document.querySelectorAll('#slots .slot').forEach(s=>s.classList.add('flyout'))},2000);
  // 3) Buchstaben durcheinander in die Ablage
  setTimeout(()=>{
    filled=Array(word.length).fill(null);
    $('slots').innerHTML=[...word].map((_,i)=>`<div class="slot" data-i="${i}"></div>`).join('');
    let order;do{order=shuffle([...word])}while(word.length>1&&order.join('')===word);
    tiles=order.map((ch,k)=>({ch,k}));
    $('tray').innerHTML=tiles.map(t=>`<div class="tile" data-k="${t.k}">${t.ch}</div>`).join('');
    $('tray').querySelectorAll('.tile').forEach(el=>{
      el.style.transform=`translate(${(Math.random()*120-60)|0}px,${(Math.random()*-160-60)|0}px) rotate(${(Math.random()*60-30)|0}deg)`;
      requestAnimationFrame(()=>requestAnimationFrame(()=>el.style.transform=''));
      el.addEventListener('click',()=>tapTile(+el.dataset.k));
    });
    document.querySelectorAll('#slots .slot').forEach(s=>s.addEventListener('click',()=>tapSlot(+s.dataset.i)));
    $('msg').textContent='Leg das Wort!';
    busy=false;
  },2800);
}

// Lautschrift: so soll das iPhone jeden Buchstaben aussprechen (hier anpassen)
const SPOKEN={A:'a',B:'bö',C:'kö',D:'dö',E:'e',F:'f',G:'gö',H:'hö',I:'i',J:'jö',K:'kö',L:'l',M:'m',N:'n',O:'o',
  P:'pö',Q:'kwö',R:'r',S:'s',T:'tö',U:'u',V:'f',W:'w',X:'ks',Y:'ü',Z:'tsö','Ä':'ä','Ö':'ö','Ü':'ü'}; // Laute statt Buchstabennamen
function tapTile(k){
  if(busy)return;
  const i=filled.indexOf(null);if(i<0)return;
  const t=tiles.find(t=>t.k===k);filled[i]=t;
  document.querySelector(`.tile[data-k="${k}"]`).classList.add('gone');
  const s=document.querySelector(`.slot[data-i="${i}"]`);s.textContent=t.ch;s.className='slot full';
  say(SPOKEN[t.ch]||t.ch);
  if(!filled.includes(null))check();
}
function tapSlot(i){            // Buchstabe zurück in die Ablage
  if(busy||!filled[i])return;
  const t=filled[i];filled[i]=null;
  document.querySelector(`.tile[data-k="${t.k}"]`).classList.remove('gone');
  const s=document.querySelector(`.slot[data-i="${i}"]`);s.textContent='';s.className='slot';
}

function check(){
  busy=true;
  const wrong=filled.map((t,i)=>t.ch!==word[i]?i:-1).filter(i=>i>=0);
  setTimeout(()=>{
    if(!wrong.length){
      document.querySelectorAll('#slots .slot').forEach(s=>s.className='slot ok');
      $('pic').classList.remove('yay');void $('pic').offsetWidth;$('pic').classList.add('yay');
      $('msg').textContent='Richtig! 🎉';
      setTimeout(()=>{idx++;idx<ROUNDS?nextWord():finish()},2000);
    }else{
      errors++;$('errs').textContent=`Fehler: ${errors}`;
      $('msg').textContent='Fast! Probier nochmal.';
      wrong.forEach(i=>document.querySelector(`.slot[data-i="${i}"]`).className='slot bad');
      setTimeout(()=>{wrong.forEach(i=>{busy=false;tapSlot(i)});busy=false},900);
    }
  },700);
}

function finish(){
  const place=errors===0?1:errors<=3?2:3;
  $('endInfo').textContent=`${ROUNDS} Wörter gelegt – ${errors} Fehler`;
  document.querySelectorAll('.step').forEach(s=>s.classList.toggle('me',+s.dataset.p===place));
  $('placeTxt').textContent=`Platz ${place}!`;
  show('end');say(`Super gemacht! Platz ${place}!`);
}

$('go').addEventListener('click',startGame);
$('again').addEventListener('click',startGame);
$('homeBtn').addEventListener('click',()=>{speechSynthesis.cancel();show('start')});
$('hero').innerHTML=['Hund','Maus','Uhu'].map(n=>svgOf(ANIMALS.find(a=>a.n===n))).join('');
if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js');
document.addEventListener('gesturestart',e=>e.preventDefault());
</script>
