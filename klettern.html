<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bergsteiger">
<title>Bergsteiger</title>
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  @font-face{font-family:Schul;src:url(schulschrift.woff2) format('woff2');font-weight:700;font-display:swap}
  :root{--ink:#2F3B4A}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
  html,body{margin:0;height:100%;overflow:hidden;touch-action:manipulation;color:var(--ink);background:#CDEBFF;
    font-family:-apple-system,"SF Pro Rounded","Arial Rounded MT Bold",system-ui,sans-serif}
  .screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;
    padding:calc(env(safe-area-inset-top) + 10px) 12px calc(env(safe-area-inset-bottom) + 14px)}
  .screen.on{display:flex}
  .btn{border:0;border-radius:22px;padding:18px 34px;font:inherit;font-size:24px;font-weight:800;color:#fff;background:#E5534B;box-shadow:0 5px 0 #A93A33}
  .btn:active{transform:translateY(4px);box-shadow:0 1px 0 #A93A33}
  #start{justify-content:center;gap:18px;text-align:center}
  h1{font-size:40px;margin:0}
  p{margin:0;font-size:20px;font-weight:700}
  header{width:100%;display:flex;justify-content:space-between;align-items:center}
  .pill{background:#fff;border-radius:16px;padding:8px 14px;font-size:18px;font-weight:800;box-shadow:0 2px 0 #A9CBE3}
  .home{border:0;background:#fff;border-radius:16px;width:46px;height:42px;font-size:22px;box-shadow:0 2px 0 #A9CBE3}
  #sceneWrap{flex:1;width:100%;min-height:0;display:flex;justify-content:center;margin:6px 0}
  #scene{height:100%;max-width:100%}
  #task{font-family:Schul,-apple-system,system-ui,sans-serif;font-weight:700;font-size:64px;line-height:1;background:#fff;border-radius:24px;
    padding:14px 26px;box-shadow:0 5px 0 #A9CBE3;margin-bottom:14px;white-space:nowrap}
  #task .q{display:inline-block;min-width:.8em;color:#E5534B}
  #task.ok .q{color:#3F9560}
  #answers{display:flex;gap:14px}
  .ans{width:92px;height:92px;border:0;border-radius:24px;background:#FFD23F;box-shadow:0 6px 0 #C9A21E;
    font-family:Schul,-apple-system,system-ui,sans-serif;font-weight:700;font-size:54px;color:var(--ink)}
  .ans:active{transform:translateY(4px);box-shadow:0 2px 0 #C9A21E}
  .ans.off{opacity:.3;pointer-events:none}
  .ans.shake{animation:shake .35s}
  .ans.right{background:#5BB87A;color:#fff;box-shadow:0 6px 0 #3F9560}
  @keyframes shake{25%{transform:translateX(6px)}75%{transform:translateX(-6px)}}
  #endBox{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 20px);display:none;flex-direction:column;align-items:center;gap:10px}
  #endBox.on{display:flex}
  #again{border:0;width:110px;height:110px;border-radius:50%;background:#5BB87A;color:#fff;font-size:54px;box-shadow:0 6px 0 #3F9560;padding-left:10px}
  #endInfo{font-size:12px;color:#6F8296}
</style>
</head>
<body>

<section id="start" class="screen on">
  <svg viewBox="0 0 300 200" width="260"><polygon points="20,190 150,30 280,190" fill="#8C9AA8"/><polygon points="150,30 118,70 134,64 150,78 166,64 182,70" fill="#fff"/>
    <line x1="150" y1="30" x2="150" y2="4" stroke="#5A3418" stroke-width="3"/><polygon points="150,4 178,11 150,18" fill="#E5534B"/></svg>
  <h1>Bergsteiger</h1>
  <p>Rechne richtig,<br>dann kletterst du nach oben!</p>
  <button class="btn" id="go">Los geht's!</button>
</section>

<section id="game" class="screen">
  <header>
    <button class="home" id="homeBtn">🏠</button>
    <div class="pill" id="lvl">0 / 7</div>
    <div style="width:46px"></div>
  </header>
  <div id="sceneWrap"><svg id="scene" viewBox="0 0 300 380"></svg></div>
  <div id="task"></div>
  <div id="answers"></div>
  <div id="endBox"><button id="again" aria-label="Nochmal">▶</button><div id="endInfo"></div></div>
</section>

<script>
const $=id=>document.getElementById(id);
const rand=n=>Math.floor(Math.random()*n);
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=rand(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id))}

// ---------- Sprache & Töne ----------
let voice=null;
function pickVoice(){const v=speechSynthesis.getVoices().filter(x=>x.lang&&x.lang.toLowerCase().startsWith('de'));
  voice=v.find(x=>/Anna|Helena|Petra|Marlene/i.test(x.name))||v[0]||null}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
let sayT=null;
function say(t,delay=300){if(!('speechSynthesis' in window))return;speechSynthesis.cancel();clearTimeout(sayT);
  const u=new SpeechSynthesisUtterance(t);u.lang='de-DE';if(voice)u.voice=voice;u.rate=.85;u.pitch=1.1;window._u=u;
  sayT=setTimeout(()=>speechSynthesis.speak(u),delay)}
let ac=null;
function audio(){if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(ac&&ac.state==='suspended')ac.resume()}
function tone(f1,f2,dur,type='sine',vol=.3,delay=0){if(!ac)return;const t=ac.currentTime+delay,o=ac.createOscillator(),g=ac.createGain();
  o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+dur)}
const bonk=()=>tone(180,70,.2,'triangle',.45);
const klack=()=>{tone(1200,800,.05,'square',.15);tone(900,600,.05,'square',.12,.08)};
const hoch=k=>tone(400+k*60,600+k*60,.25,'sine',.25);
// Jodler: schnelle Sprünge zwischen tiefer und hoher Stimme ("Jo-lo-di-ri-di-ö")
function jodel(delay=0){if(!ac)return;const t0=ac.currentTime+delay,o=ac.createOscillator(),v=ac.createOscillator(),vg=ac.createGain(),
  f=ac.createBiquadFilter(),g=ac.createGain();
  o.type='sawtooth';f.type='lowpass';f.frequency.value=1800;f.Q.value=4;v.frequency.value=6;vg.gain.value=7;v.connect(vg).connect(o.frequency);
  const N=[[247,.16],[494,.16],[392,.16],[587,.22],[494,.16],[740,.34],[587,.16],[494,.16],[392,.16],[494,.5]];
  let t=t0;g.gain.setValueAtTime(.001,t);
  N.forEach(([fr,d],i)=>{o.frequency.setTargetAtTime(fr,t,.015);f.frequency.setTargetAtTime(fr>450?2600:1300,t,.02);
    g.gain.setTargetAtTime(.22,t,.01);g.gain.setTargetAtTime(.07,t+d-.04,.01);t+=d});
  g.gain.setTargetAtTime(.001,t,.08);
  o.connect(f).connect(g).connect(ac.destination);o.start(t0);v.start(t0);o.stop(t+.5);v.stop(t+.5)}
const jubel=()=>[523,659,784,1047,1319].forEach((f,i)=>tone(f,f,.28,'sine',.3,i*.13));

// ---------- Berg ----------
const STEPS=7;
let P=[];
// Haken-Positionen: Abstand nach oben = Ergebnis der Aufgabe (längeres Seil = weiter)
function buildPath(){const tot=tasks.reduce((s,t)=>s+t.r,0);let c=0;
  P=[[150,345]];tasks.forEach((t,i)=>{c+=t.r;const f=c/tot,y=345-f*319;P.push([i===STEPS-1?150:150+(i%2?-1:1)*62*(1-f*.8),y])})}
function climber(){return `<g id="cl">
  <line x1="-5" y1="2" x2="-13" y2="-14" stroke="#F6CBA0" stroke-width="5" stroke-linecap="round"/>
  <line x1="5" y1="2" x2="13" y2="-14" stroke="#F6CBA0" stroke-width="5" stroke-linecap="round"/>
  <line x1="-4" y1="16" x2="-9" y2="30" stroke="#3E5C99" stroke-width="6" stroke-linecap="round"/>
  <line x1="4" y1="16" x2="9" y2="30" stroke="#3E5C99" stroke-width="6" stroke-linecap="round"/>
  <rect x="-9" y="-2" width="18" height="21" rx="6" fill="#E5534B"/>
  <rect x="-6" y="-1" width="12" height="14" rx="3" fill="#F7B500" opacity=".9"/>
  <circle cx="0" cy="-10" r="8" fill="#F6CBA0"/>
  <path d="M-9 -11 A9 9 0 0 1 9 -11 Z" fill="#FFD23F"/>
  <circle cx="-3" cy="-8" r="1.3" fill="#222"/><circle cx="3" cy="-8" r="1.3" fill="#222"/>
  <path d="M-3 -4 Q0 -2 3 -4" stroke="#222" stroke-width="1.2" fill="none"/></g>`}
function drawScene(){
  const anchors='';
  $('scene').innerHTML=`
  <defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8FCBF2"/><stop offset="1" stop-color="#DDF1FF"/></linearGradient></defs>
  <rect y="-12" width="300" height="392" fill="url(#sky)"/>
  <g fill="#fff" opacity=".9"><circle cx="40" cy="60" r="14"/><circle cx="58" cy="54" r="18"/><circle cx="76" cy="62" r="13"/>
    <circle cx="232" cy="110" r="12"/><circle cx="248" cy="104" r="16"/><circle cx="264" cy="112" r="11"/></g>
  <polygon points="-20,380 150,26 320,380" fill="#8C9AA8"/>
  <polygon points="150,26 70,200 100,190 150,160" fill="#7B8896"/>
  <polygon points="150,26 118,92 134,84 150,100 166,84 184,94" fill="#fff"/>
  <rect y="352" width="300" height="28" fill="#7CC46A"/>
  <line x1="150" y1="26" x2="150" y2="-6" stroke="#5A3418" stroke-width="3"/>
  <polygon id="flag" points="150,-6 176,1 150,8" fill="#E5534B"/>
  ${anchors}
  <polyline id="rope" fill="none" stroke="#B5651D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" points="${P[0].join(',')}"/>
  <g id="hooks"></g>
  <path id="ropeNew" fill="none" stroke="#B5651D" stroke-width="3" stroke-linecap="round"/>
  <g id="ropeEnd" opacity="0"><circle r="5" fill="#5F6B78"/><text id="ropeNum" x="9" y="5" font-size="16" font-weight="700" fill="#E5534B" font-family="Schul,system-ui">0</text></g>
  <g id="clPos" transform="translate(${P[0][0]} ${P[0][1]-12})">${climber()}</g>`;
  $('scene').setAttribute('viewBox','0 -12 300 392');
}

// ---------- Aufgaben ----------
let step=0,task=null,busy=false,firstTry=0,wrong=0,seen=new Set(),tasks=[];
function makeTask(){
  for(let t=0;t<50;t++){
    let a,b,op;
    if(step<4||Math.random()<.5){op='+';a=1+rand(9);b=1+rand(10-a);if(a+b>10)continue}
    else{op='−';a=3+rand(8);b=1+rand(a-2)}
    const key=a+op+b;if(seen.has(key))continue;seen.add(key);
    return{a,b,op,r:op==='+'?a+b:a-b}}
  return{a:2,b:3,op:'+',r:5}}
function options(r){const c=shuffle([-2,-1,1,2].map(d=>r+d).filter(x=>x>=0&&x<=10)).slice(0,2);return shuffle([r,...c])}
const spoken=t=>`${t.a} ${t.op==='+'?'plus':'minus'} ${t.b}`;
function newTask(){
  task=tasks[step];wrong=0;busy=false;
  $('task').classList.remove('ok');$('task').innerHTML=`${task.a} ${task.op} ${task.b} = <span class="q">?</span>`;
  $('answers').innerHTML=options(task.r).map(n=>`<button class="ans" data-n="${n}">${n}</button>`).join('');
  $('answers').querySelectorAll('.ans').forEach(b=>b.addEventListener('click',()=>answer(+b.dataset.n,b)));
  $('lvl').textContent=`${step} / ${STEPS}`;
  say(spoken(task),400);
}
function answer(n,btn){
  if(busy)return;audio();
  if(n!==task.r){wrong++;bonk();btn.classList.remove('shake');void btn.offsetWidth;btn.classList.add('shake');
    setTimeout(()=>btn.classList.add('off'),350);say(`Nochmal: ${spoken(task)}`,200);return}
  busy=true;if(wrong===0)firstTry++;
  btn.classList.add('right');$('task').classList.add('ok');$('task').querySelector('.q').textContent=task.r;
  say(`${spoken(task)} ist ${task.r}!`,100);klack();
  climb(()=>{step++;$('lvl').textContent=`${step} / ${STEPS}`;if(step<STEPS)setTimeout(newTask,500);else summit()});
}
function climb(done){
  const [x0,y0]=P[step],[x1,y1]=P[step+1],rn=$('ropeNew'),re=$('ropeEnd'),hx=x0+8,hy=y0-26;
  $('ropeNum').textContent=task.r;re.setAttribute('opacity',1);
  let t0=null;
  function toss(now){if(!t0)t0=now;const q=Math.min(1,(now-t0)/750);          // Seilende fliegt im Bogen zum nächsten Punkt
    const ex=hx+(x1-hx)*q,ey=hy+(y1-hy)*q-55*Math.sin(Math.PI*q);
    rn.setAttribute('d',`M ${hx} ${hy} Q ${(hx+ex)/2+20} ${(hy+ey)/2+25*(1-q)} ${ex} ${ey}`);
    re.setAttribute('transform',`translate(${ex} ${ey})`);
    if(q<1)requestAnimationFrame(toss);
    else{klack();$('hooks').insertAdjacentHTML('beforeend',`<circle cx="${x1}" cy="${y1}" r="4.5" fill="none" stroke="#5F6B78" stroke-width="2.5"/>`);
      re.setAttribute('opacity',0);rn.setAttribute('d',`M ${hx} ${hy} L ${x1} ${y1}`);hoch(step);t0=null;setTimeout(()=>requestAnimationFrame(move),250)}}
  function move(now){if(!t0)t0=now;const q=Math.min(1,(now-t0)/800),e=q<.5?2*q*q:1-Math.pow(-2*q+2,2)/2;   // Kletterer zieht sich hoch
    const x=x0+(x1-x0)*e,y=y0+(y1-y0)*e-12+Math.sin(q*Math.PI*3)*-2;
    $('clPos').setAttribute('transform',`translate(${x} ${y})`);
    rn.setAttribute('d',`M ${x+8} ${y-14} L ${x1} ${y1}`);
    if(q<1)requestAnimationFrame(move);
    else{$('rope').setAttribute('points',P.slice(0,step+2).map(p=>p.join(',')).join(' '));rn.setAttribute('d','');done()}}
  requestAnimationFrame(toss);
}
function summit(){
  $('task').style.display='none';$('answers').style.display='none';
  jodel(.4);say('Juhu! Du bist auf dem Gipfel!',3100);
  const cl=$('cl');cl.innerHTML=cl.innerHTML.replace('x2="-13" y2="-14"','x2="-15" y2="-22"').replace('x2="13" y2="-14"','x2="15" y2="-22"');
  let t0=null;const flag=$('flag');
  (function wave(now){if(!t0)t0=now;const t=(now-t0)/1000;
    flag.setAttribute('points',`150,-6 ${176+Math.sin(t*6)*3},${1+Math.sin(t*6+1)*2} 150,8`);
    $('clPos').setAttribute('transform',`translate(150 ${P[STEPS][1]-14-Math.abs(Math.sin(t*5))*8})`);
    if($('game').classList.contains('on')&&$('endBox').classList.contains('on'))requestAnimationFrame(wave)})(performance.now());
  $('endInfo').textContent=`Eltern: ${firstTry} von ${STEPS} Aufgaben beim ersten Versuch richtig`;
  $('endBox').classList.add('on');
}
function startGame(){audio();if('speechSynthesis' in window){const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u)}
  step=0;firstTry=0;seen=new Set();tasks=[];for(step=0;step<STEPS;step++)tasks.push(makeTask());step=0;buildPath();$('endBox').classList.remove('on');$('task').style.display='';$('answers').style.display='';
  show('game');drawScene();newTask()}
$('go').addEventListener('click',startGame);
$('again').addEventListener('click',startGame);
$('homeBtn').addEventListener('click',()=>{busy=true;$('endBox').classList.remove('on');if('speechSynthesis' in window)speechSynthesis.cancel();show('start')});
if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js');
document.addEventListener('gesturestart',e=>e.preventDefault());
</script>
</body>
</html>
